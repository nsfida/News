<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khawrai Falahi Committee e-Card</title>
<style>
body{margin:0;font-family:Calibri,sans-serif;background:#e3f2fd;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
.form-container{background:#fff;padding:30px;border-radius:55px;box-shadow:0 8px 15px rgba(0,0,0,0.1);max-width:600px;width:100%;text-align:center;}
h2{font-size:20px;margin-bottom:20px;color:#1976d2;}
label{display:block;text-align:left;margin-bottom:5px;color:#555;font-weight:bold;}
input,select{width:100%;padding:10px;margin-bottom:15px;border-radius:50px;border:1px solid #ddd;font-size:14px;}
input:focus, select:focus{border-color:#1976d2;outline:none;}
button{padding:12px 20px;background:#1976d2;color:#fff;font-size:16px;border:none;border-radius:30px;cursor:pointer;}
button:hover{background:#125fa6;}
.translate-link{text-align:right;font-size:12px;margin-bottom:10px;}
.translate-link a{color:#1976d2;text-decoration:none;font-weight:bold;}
</style>
</head>
<body>
<div class="form-container">
<h2>e-Card Generator</h2>
<form id="ecardForm">
<label for="name">Name (English)</label>
<input type="text" id="name" required>
<label for="urdu_name">Name (Urdu)</label>
<input type="text" id="urdu_name" required>
<div class="translate-link"><a href="https://www.google.com/search?q=english+to+urdu" target="_blank">Translate to Urdu</a></div>
<label for="designation">Designation</label>
<select id="designation" required>
<option value="Committee Member">Committee Member</option>
<option value="President">President</option>
<option value="Vice President">Vice President</option>
<option value="Finance Secretary">Finance Secretary</option>
<option value="Media Manager">Media Manager</option>
<option value="Media Secretary">Media Secretary</option>
<option value="Committee Guardian">Committee Guardian</option>
<option value="Other">Other</option>
</select>
<label for="card_number">Card Number</label>
<input type="text" id="card_number" value="746-210-" required>
<label for="blood_group">Blood Group</label>
<select id="blood_group" required>
<option value="A+">A+</option><option value="A-">A-</option>
<option value="B+">B+</option><option value="B-">B-</option>
<option value="O+">O+</option><option value="O-">O-</option>
<option value="AB+">AB+</option><option value="AB-">AB-</option>
<option value="N/A">N/A</option>
</select>
<label for="contact">Contact (Mobile)</label>
<input type="text" id="contact" placeholder="+9715..." required>
<label for="photo">Upload Photo</label>
<input type="file" id="photo" accept="image/*" required>
<button type="submit">Generate e-Card</button>
</form>
</div>

<script>
if(!localStorage.getItem("loggedInUser")) window.location.href="login.html";

document.getElementById("ecardForm").addEventListener("submit",function(e){
  e.preventDefault();
  const name = document.getElementById("name").value;
  const urdu = document.getElementById("urdu_name").value;
  const designation = document.getElementById("designation").value;
  const cardNo = document.getElementById("card_number").value;
  const blood = document.getElementById("blood_group").value;
  const contact = document.getElementById("contact").value;
  const file = document.getElementById("photo").files[0];
  if(!file){ alert("Please upload a photo"); return; }
  const reader = new FileReader();
  reader.onload = function(evt){
    localStorage.setItem("ecardData",JSON.stringify({
      name:name, urduName:urdu, designation:designation,
      cardNumber:cardNo, bloodGroup:blood, contact:contact,
      photoData:evt.target.result
    }));
    window.location.href="generate.html";
  };
  reader.readAsDataURL(file);
});
</script>
</body>
</html>
