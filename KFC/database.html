    <p id="loginError"></p>
  </div>
</div>

  <label for="searchField"><i class="fas fa-search"></i> Search By:</label>

    <option value="BG">Blood Type</option>
    <option value="mobile">Mobile Number</option>
    <option value="CNo">e-Card Number</option>
    <option value="Status">e-Card Status</option>
    <option value="Room">Room Number</option>
    <option value="Issue">e-Card Issue Date</option>
  </select>

  <label for="searchInput"><i class="fas fa-keyboard"></i> Enter Search Term:</label>
  <input type="text" id="searchInput" placeholder="Search Term">

  <div class="buttons-container">
    <button id="searchButton" disabled><i class="fas fa-magnifying-glass"></i> Search</button>
    <button id="printButton" disabled><i class="fas fa-print"></i> Print Results</button>
    <button id="generateButton"><i class="fas fa-plus-circle"></i> New e-Card</button>
    <button id="englishConstitution"><i class="fas fa-file-pdf"></i> Constitution (English)</button>
