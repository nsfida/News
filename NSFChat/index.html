<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="NSFChat — Modern real-time messaging">
  <meta name="theme-color" content="#07070f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NSFChat</title>

  <!-- Favicon (inline SVG data URI) -->
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ══════════════════════════════════════
       LOADING SCREEN
  ═══════════════════════════════════════ -->
  <div id="loading-screen">
    <div class="loading-logo-wrap">
      <img src="assets/logo.svg" alt="NSFChat">
      <span class="loading-wordmark">NSFChat</span>
    </div>
    <div class="spinner"></div>
  </div>

  <!-- ══════════════════════════════════════
       AUTH SCREEN  (rendered via JS)
  ═══════════════════════════════════════ -->
  <div id="auth-screen" class="hidden"></div>

  <!-- ══════════════════════════════════════
       PROFILE SETUP SCREEN
  ═══════════════════════════════════════ -->
  <div id="profile-setup-screen" class="hidden"></div>

  <!-- ══════════════════════════════════════
       MAIN APP SCREEN
  ═══════════════════════════════════════ -->
  <div id="app-screen" class="hidden">

    <!-- LEFT SIDEBAR -->
    <div id="sidebar"></div>

    <!-- MAIN CONTENT (welcome or conversation) -->
    <div id="main-content"></div>

  </div>

  <!-- ══════════════════════════════════════
       TOAST NOTIFICATIONS
  ═══════════════════════════════════════ -->
  <div id="toast-container"></div>

  <!-- ══════════════════════════════════════
       SCRIPTS
  ═══════════════════════════════════════ -->
  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <!-- App -->
  <script src="js/app.js"></script>

</body>
</html>
