<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Database Khawrai Falahi Committee UAE</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="logo-title">
<img src="logo.png" alt="Logo">
<div>
<h2>Khawrai Falahi Committee UAE</h2>
<p class="uae-text">خاورئی فلاحی کمیٹی متحدہ عرب امارات</p>
</div>
</div>

<div class="form-container">

<label for="searchField">Search By:</label>
<select id="searchField">
<option value="name">Member Name</option>
<option value="Desg">Designation</option>
<option value="BG">Blood Type</option>
<option value="mobile">Mobile Number</option>
<option value="CNo">e-Card Number</option>
<option value="Status">e-Card Status</option>
<option value="Room">Room Number</option>
<option value="Issue">e-Card Issue Date</option>
</select>

<label for="searchInput">Enter Search Term:</label>
<input type="text" id="searchInput" placeholder="Search Term">

<div class="buttons-container">
<button id="searchButton" disabled>Search</button>
<button id="printButton" disabled>Print Results</button>
<button id="generateButton">New e-Card</button>
<button id="englishConstitution">Constitution (English)</button>
<button id="urduConstitution">Constitution (اردو)</button>
</div>

</div>

<div id="resultContainer"></div>

<footer>
<p>Powered by <a href="https://www.facebook.com/nadeemshahzadfida" target="_blank">Nadeem Shahzad Fida</a></p>
</footer>

<script src="script.js"></script>

</body>
</html>
