<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khawrai Falahi Committee UAE</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- Loader -->
<div id="loader">
  <div class="loader"></div>
</div>

<!-- Background -->
<div class="bg"></div>

<div class="container">

  <!-- Header -->
  <header class="header">
    <img src="logo.png" class="logo">
    <div>
      <h1>Khawrai Falahi Committee UAE</h1>
      <p class="urdu">خاورئی فلاحی کمیٹی متحدہ عرب امارات</p>
    </div>
  </header>

  <!-- Search Panel -->
  <div class="glass-card">
    <label><i class="fa-solid fa-filter"></i> Search By</label>
    <select id="searchField">
      <option value="name">Member Name</option>
      <option value="Desg">Designation</option>
      <option value="BG">Blood Type</option>
      <option value="mobile">Mobile Number</option>
      <option value="CNo">e-Card Number</option>
      <option value="Status">e-Card Status</option>
      <option value="Room">Room Number</option>
      <option value="Issue">e-Card Issue Date</option>
    </select>

    <label><i class="fa-solid fa-magnifying-glass"></i> Search</label>
    <input type="text" id="searchInput" placeholder="Enter search term">

    <div class="buttons">
      <button id="searchButton" disabled><i class="fa-solid fa-search"></i> Search</button>
      <button id="printButton" disabled><i class="fa-solid fa-print"></i> Print</button>
      <button id="generateButton"><i class="fa-solid fa-id-card"></i> New e-Card</button>
      <button id="englishConstitution"><i class="fa-solid fa-book"></i> English Constitution</button>
      <button id="urduConstitution"><i class="fa-solid fa-book-quran"></i> اردو دستور</button>
    </div>
  </div>

  <div id="resultContainer"></div>

  <!-- Footer -->
  <footer class="footer">

    <div class="footer-contacts">
      <div><i class="fa-solid fa-user-tie"></i> President: Arbab Muhammad Rizwan <a href="tel:+971557353212">+971 55 735 3212</a></div>
      <div><i class="fa-solid fa-user"></i> Vice President: Salar Khan <a href="tel:+971588840090">+971 58 884 0090</a></div>
      <div><i class="fa-solid fa-user-gear"></i> Acting President: Ahmad Aman Khattak <a href="tel:+971568039690">+971 56 803 9690</a></div>
      <div><i class="fa-solid fa-coins"></i> Finance Manager: Naveed Ali Liaqat <a href="tel:+971529297289">+971 52 929 7289</a></div>
    </div>

    <div class="footer-credit">
      <i class="fa-solid fa-code"></i> Powered by <a href="https://www.facebook.com/nadeemshahzadfida" target="_blank">Nadeem Shahzad Fida</a>
    </div>

  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
