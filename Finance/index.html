<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triple-M by NSF Has Moved</title>
  <meta name="description" content="Triple-M by NSF has moved to its new official address at triplem.vip." />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.18), transparent 35%),
        linear-gradient(135deg, #050816, #0b1024 45%, #111827);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 720px;
      text-align: center;
      padding: 48px 34px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(22px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin-bottom: 26px;
      filter: drop-shadow(0 12px 25px rgba(0, 0, 0, 0.35));
    }

    .label {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #dbeafe;
      font-size: 13px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(32px, 5vw, 54px);
      line-height: 1.08;
      margin-bottom: 18px;
      font-weight: 800;
    }

    p {
      max-width: 560px;
      margin: 0 auto 28px;
      color: #cbd5e1;
      font-size: 17px;
      line-height: 1.7;
    }

    .highlight {
      color: #ffffff;
      font-weight: 700;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 28px;
      border-radius: 999px;
      background: #ffffff;
      color: #0f172a;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 16px 35px rgba(255, 255, 255, 0.18);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 22px 45px rgba(255, 255, 255, 0.25);
    }

    .footer {
      margin-top: 34px;
      color: #94a3b8;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      .card {
        padding: 38px 22px;
        border-radius: 22px;
      }

      .logo {
        width: 90px;
        height: 90px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <img src="logo.png" alt="Triple-M by NSF Logo" class="logo" />

    <div class="label">A Message from Triple-M by NSF</div>

    <h1>We Have Moved</h1>

    <p>
      Triple-M by NSF is no longer accessible from this location.
      Our platform has officially moved to our new address:
      <span class="highlight">https://triplem.vip/</span>
    </p>

    <a href="https://triplem.vip/" class="button">
      Visit New Website →
    </a>

    <div class="footer">
      Please update your bookmarks and continue using Triple-M by NSF from the new official link.
    </div>
  </main>
</body>
</html>
