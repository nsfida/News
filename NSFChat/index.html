<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="NSFChat — Modern real-time messaging">
  <meta name="theme-color" content="#f4f7ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>NSFChat</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loading-screen">
    <div class="loading-logo-wrap">
      <img src="assets/logo.svg" alt="NSFChat">
      <span class="loading-wordmark">NSFChat</span>
    </div>
    <div class="spinner"></div>
  </div>

  <div id="auth-screen" class="hidden"></div>
  <div id="profile-setup-screen" class="hidden"></div>
  <div id="app-screen" class="hidden">
    <div id="sidebar"></div>
    <div id="main-content"></div>
  </div>
  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
