<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Khawrai Falahi Committee UAE</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

/* ----- Urdu Font ----- */
@font-face{
  font-family:'UrduFont';
  src:url('https://livenews.live/KFC/NewCard/static/fonts/urdu.ttf') format('truetype');
  font-weight:normal;
  font-style:normal;
}

/* ----- Reset & Base Styles ----- */
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Calibri',sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  background: linear-gradient(135deg,#e0eaff,#ffffff);
  color:#1a1a1a;
  padding:20px;
  overflow-x:hidden;
}

/* Automatically apply Urdu font */
:lang(ur){
  font-family:'UrduFont',serif;
  direction:rtl;
}

/* ----- Hero Section (Liquid Glass) ----- */
.hero{
  position:relative;
  width:100%;
  padding:1.5rem;
  display:flex;
  justify-content:center;
  align-items:center;
}

.hero-overlay{
  position:absolute;
  top:0; left:0; width:100%; height:100%;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(18px) saturate(180%);
  z-index:1;
  border-radius:25px;
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:850px;
  width:100%;
  padding:2rem 1.5rem;
  border-radius:25px;
  background:rgba(255,255,255,0.2);
  box-shadow:0 8px 32px rgba(0,0,0,0.15);
  border:1px solid rgba(255,255,255,0.3);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  animation:fadeInUp 1s ease forwards;
}

/* Logo + Title */
.logo-title{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  margin-bottom:20px;
}

.logo-title img.logo{
  width:80px;
  margin-bottom:12px;
  animation:logoFade 2.5s ease-in-out infinite;
}

@keyframes logoFade{
  0%{opacity:0.8;transform:scale(1);}
  50%{opacity:1;transform:scale(1.05);}
  100%{opacity:0.8;transform:scale(1);}
}

.logo-title h1{
  font-size:22px;
  margin-bottom:8px;
  text-shadow:1px 1px 10px rgba(0,0,0,0.1);
}

.logo-title h1 span{
  color:#fff;
  background:linear-gradient(90deg,#ff6ec4,#7873f5);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero-title-ur{
  font-size:16px;
  color:#0d3c91;
  margin-bottom:1rem;
}

/* ----- Top Buttons ----- */
.top-buttons{
  position:absolute;
  top:15px;
  left:15px;
  display:flex;
  gap:10px;
  z-index:5;
}

.top-buttons a{
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  border-radius:50%;
  background:linear-gradient(90deg,#ff6ec4,#7873f5);
  color:#fff;
  text-decoration:none;
  box-shadow:0 6px 18px rgba(0,0,0,0.25);
  transition:0.3s;
  font-size:18px;
}

.top-buttons a:hover{
  transform:scale(1.1);
}

/* ----- Feed Cards ----- */
.feed{
  width:100%;
  max-width:850px;
  display:flex;
  flex-direction:column;
  gap:18px;
  margin-top:10px;
}

.card{
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(18px) saturate(180%);
  border-radius:18px;
  padding:15px;
  box-shadow:0 8px 32px rgba(0,0,0,0.15);
  border:1px solid rgba(255,255,255,0.3);
}

.card-title{
  font-weight:bold;
  font-size:16px;
  margin-bottom:4px;
}

.card-date{
  font-size:12px;
  color:#0d3c91;
  margin-bottom:8px;
}

.media{
  width:100%;
  border-radius:14px;
  overflow:hidden;
  background:#000;
  margin-bottom:8px;
}

.media img{
  width:100%;
  height:auto;
  object-fit:cover;
}

.media video{
  width:100%;
  height:auto;
  max-height:65vh;
  object-fit:contain;
  background:#000;
}

.card-caption{
  font-size:13px;
  line-height:1.5;
  color:#333;
}

/* Loader */
.loader{
  text-align:center;
  padding:20px;
  font-size:14px;
  color:#555;
}

@keyframes fadeInUp{
  0%{opacity:0;transform:translateY(40px);}
  100%{opacity:1;transform:translateY(0);}
}

/* Floating Shapes */
.floating-shape{
  position:absolute;
  border-radius:50%;
  opacity:0.25;
  animation:floatShapes 8s ease-in-out infinite;
  z-index:0;
}

.shape1{width:120px;height:120px;background:linear-gradient(135deg,#ff9a9e,#fad0c4);top:10%;left:5%;}
.shape2{width:180px;height:180px;background:linear-gradient(135deg,#a1c4fd,#c2e9fb);bottom:15%;right:10%;}
.shape3{width:90px;height:90px;background:linear-gradient(135deg,#fccb90,#d57eeb);top:50%;left:70%;}

@keyframes floatShapes{
  0%,100%{transform:translateY(0) rotate(0deg);}
  25%{transform:translateY(-15px) rotate(45deg);}
  50%{transform:translateY(15px) rotate(90deg);}
  75%{transform:translateY(-10px) rotate(135deg);}
}

/* Responsive */
@media(max-width:768px){
  .logo-title h1{font-size:20px;}
  .hero-title-ur{font-size:14px;}
}

@media(max-width:480px){
  .logo-title img.logo{width:70px;}
  .logo-title h1{font-size:18px;}
  .hero-title-ur{font-size:13px;}
}

</style>
</head>

<body>

<section class="hero">
<div class="hero-overlay"></div>

<div class="hero-content glass-panel">

<!-- Top Left Buttons -->
<div class="top-buttons">
  <a href="https://livenews.live/KFC/index.html" title="Home"><i class="fa-solid fa-home"></i></a>
  <a href="https://livenews.live/KFC/message/alerts.html" title="Alerts"><i class="fa-solid fa-bell"></i></a>
  <a href="https://livenews.live/KFC/message/cabinet.html" title="Cabinet Members"><i class="fa-solid fa-users"></i></a>
</div>

<div class="logo-title">
  <img src="https://livenews.live/KFC/logo.png" alt="Logo" class="logo">
  <h1>Gallery - <span>Khawrai Falahi Committee UAE</span></h1>
  <h2 class="hero-title-ur" lang="ur">
    خاورئی فلاحی کمیٹی متحدہ عرب امارات
  </h2>
</div>

<div class="feed" id="feed"></div>
<div class="loader" id="loader">Loading...</div>

<div class="floating-shape shape1"></div>
<div class="floating-shape shape2"></div>
<div class="floating-shape shape3"></div>

</div>
</section>

<script>
const feed = document.getElementById('feed');
const loader = document.getElementById('loader');

fetch('https://livenews.live/KFC/message/Gallery/gallery.json')
.then(res => res.json())
.then(data => {
  loader.style.display='none';
  data.forEach(item => {
    const card=document.createElement('div');
    card.className='card';
    let mediaHTML='';
    if(item.type==='image'){
      mediaHTML=`<div class="media"><img src="${item.src}" loading="lazy" alt=""></div>`;
    } else if(item.type==='video'){
      mediaHTML=`<div class="media"><video controls preload="metadata" playsinline>
                   <source src="${item.src}" type="video/mp4">
                 </video></div>`;
    }
    card.innerHTML=`
      <div class="card-title">${item.title}</div>
      <div class="card-date">${item.date}</div>
      ${mediaHTML}
      <div class="card-caption">${item.caption}</div>
    `;
    feed.appendChild(card);
  });
})
.catch(err=>{
  loader.innerHTML="Failed to load gallery.";
  console.error(err);
});
</script>

</body>
</html>
