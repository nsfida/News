<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khawrai Falahi Committee e-Card Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

/* URDU FONT */
@font-face{
font-family:'UrduFont';
src:url('static/fonts/Urdu.ttf') format('truetype');
}

/* BODY */

body{
font-family:Calibri,sans-serif;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:20px;
overflow-x:hidden;

background:linear-gradient(270deg,#cfe8ff,#ffffff,#e8f3ff);
background-size:600% 600%;
animation:gradientMove 20s ease infinite;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* FLOATING LOGOS */

.floating-logos{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:-1;
overflow:hidden;
}

.floating-logos::before,
.floating-logos::after{
content:"";
position:absolute;
width:120%;
height:120%;
background-image:url("static/images/logo.png");
background-size:90px;
background-repeat:repeat;
opacity:0.05;
animation:floatLogos 80s linear infinite;
}

.floating-logos::after{
animation-direction:reverse;
opacity:0.03;
}

@keyframes floatLogos{
0%{transform:translateY(0);}
50%{transform:translateY(-200px);}
100%{transform:translateY(0);}
}

/* HEADER */

.logo-title{
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
margin-bottom:20px;
animation:fadeDown 1s ease;
}

.logo-title img.logo{
width:80px;
margin-bottom:10px;
animation:logoFade 3s ease-in-out infinite;
}

@keyframes logoFade{
0%{opacity:0.4}
50%{opacity:1}
100%{opacity:0.4}
}

.logo-title h2{
font-size:26px;
color:#0d3c91;
font-weight:bold;
}

.uae-text{
font-family:'UrduFont';
direction:rtl;
text-align:center;
font-size:20px;
color:#0d3c91;
margin-top:5px;
}

/* LOGIN BOX */

.login-box{
background:rgba(255,255,255,0.25);
backdrop-filter:blur(20px);
border-radius:25px;
padding:40px 30px;
width:400px;
max-width:90%;
box-shadow:0 20px 40px rgba(0,0,0,0.15);
border:1px solid rgba(255,255,255,0.5);
}

/* INPUTS */

.login-box form{
display:flex;
flex-direction:column;
}

.login-box input{
margin:10px 0;
padding:12px 15px;
font-size:15px;
border-radius:50px;
border:1px solid rgba(0,0,0,0.1);
outline:none;
transition:0.3s;
}

.login-box input:focus{
border-color:#1976d2;
box-shadow:0 0 12px rgba(25,118,210,0.3);
}

/* BUTTON */

.login-box button{
padding:12px;
font-size:16px;
border:none;
border-radius:50px;
background:linear-gradient(135deg,#1976d2,#125fa6);
color:white;
cursor:pointer;
margin-top:10px;
display:flex;
justify-content:center;
align-items:center;
gap:5px;
transition:0.3s;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.login-box button:hover{
transform:translateY(-3px);
}

/* ERROR */

.error-msg{
color:red;
font-size:14px;
margin-bottom:10px;
}

/* CONTACT */

.contact-banner{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
margin-top:20px;
padding:15px 20px;

background:rgba(255,255,255,0.25);
backdrop-filter:blur(20px);
border-radius:25px;
box-shadow:0 15px 30px rgba(0,0,0,0.15);
}

.contact-banner a{
text-decoration:none;
color:#0d3c91;
display:flex;
align-items:center;
gap:6px;
font-weight:bold;
transition:0.3s;
}

.contact-banner a:hover{
transform:translateY(-3px);
}

.contact-banner span{
font-size:12px;
color:#125fa6;
}

/* FOOTER */

footer{
margin-top:15px;
font-size:14px;
text-align:center;
}

/* MOBILE */

@media(max-width:600px){

.logo-title h2{font-size:22px;}
.uae-text{font-size:17px;}

.login-box{
padding:25px;
}

.login-box input{
font-size:14px;
}

.login-box button{
font-size:14px;
}

}

</style>
</head>

<body>

<div class="floating-logos"></div>

<div class="logo-title">
<img src="static/images/logo.png" class="logo">
<h2>Khawrai Falahi Committee UAE</h2>
<p class="uae-text">خاورئی فلاحی کمیٹی متحدہ عرب امارات</p>
</div>

<div class="login-box">

<div class="error-msg" id="errorMsg"></div>

<form id="loginForm">

<input type="text" id="username" placeholder="Username" required>

<input type="password" id="password" placeholder="Password" required>

<button type="submit">
<i class="fas fa-right-to-bracket"></i>
Login
</button>

</form>

</div>

<div class="contact-banner">
<a href="https://wa.me/971557353212" target="_blank"><i class="fab fa-whatsapp"></i> Arbab M. Rizwan <span>President</span></a>
<a href="https://wa.me/971588840090" target="_blank"><i class="fab fa-whatsapp"></i> Salar Khan <span>Vice President</span></a>
<a href="https://wa.me/971568039690" target="_blank"><i class="fab fa-whatsapp"></i> Ahmad A. Khattak <span>Acting President</span></a>
<a href="https://wa.me/971529297289" target="_blank"><i class="fab fa-whatsapp"></i> Naveed A. Liaqat <span>Finance Manager</span></a>
</div>

<footer>
Powered by <a href="https://www.facebook.com/nadeemshahzadfida" target="_blank">Nadeem Shahzad Fida</a>
</footer>

<script>

/* SAME LOGIN SCRIPT (UNCHANGED) */

const USERS = {
"bnNm aWRh":"NzQ2MjEw",
"YWhtYWRhbWFu":"NDU2NDU2",
"c2FiaXJhbGk=":"MzU2NDI1",
"YXJiYWJyaXp3YW4=":"MDIzNjYz",
"bmF2ZWVkYWxp":"MTAxMDgx",
"YW1qYWRhbGk=":"YW1qYWRhbDEyMw==",
"c2FsYXJraGFu":"c2FsYXI0NTY="
};

function decodeBase64(str){
return atob(str.replace(/\s/g,''));
}

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

const uInput=document.getElementById("username").value.trim();
const pInput=document.getElementById("password").value.trim();

let authenticated=false;

for(const encodedUser in USERS){

if(decodeBase64(encodedUser)===uInput && decodeBase64(USERS[encodedUser])===pInput){

authenticated=true;

localStorage.setItem("loggedInUser",uInput);

window.location.href="index.html";

break;

}

}

if(!authenticated){

document.getElementById("errorMsg").textContent="Invalid username or password";

}

});

if(localStorage.getItem("loggedInUser")) window.location.href="index.html";

</script>

</body>
</html>
