<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Triple M by NSF</title>
  <meta name="description" content="Simple loan tracking for money given, received back, loan taken, and returned back." />
  <link rel="icon" type="image/png" href="Assets/logo/logo.png" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.57/dist/zip.min.js"></script>
  <link rel="stylesheet" href="Assets/style/styles.css" />
</head>
<body>
  <div class="page-currency-bg" id="pageCurrencyBg" aria-hidden="true"></div>
  <div id="lockScreen" class="lock">
    <div class="lock-card">
      <div class="brand">
        <img class="mark" src="Assets/logo/logo.png" alt="Logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjMjQ1N2Q2IiByeD0iMTIiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSIxNiIgZmlsbD0iI2ZmZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXdlaWdodD0iYm9sZCI+TkY8L3RleHQ+PC9zdmc+'" />
        <div>
          <h1>TRIPLE M by NSF</h1>
          <p>Money Management Module (Powered by Nadeem Shahzad Fida)</p>
        </div>
      </div>
      
      <div class="login-header">
        <h2>Welcome Back</h2>
        <p class="login-subtitle">Sign in to access your financial dashboard</p>
      </div>
      
      <form class="login-form" onsubmit="return false;">
        <div class="form-group">
          <label for="zipUsernameInput" class="form-label">Username</label>
          <div class="input-wrapper">
            <input id="zipUsernameInput" class="input lock-input-full" type="text" placeholder="Enter your username" autocomplete="username" autocapitalize="off" spellcheck="false" />
            <span class="input-icon">👤</span>
          </div>
        </div>
        
        <div class="form-group">
          <label for="zipPasswordInput" class="form-label">Password</label>
          <div class="input-wrapper">
            <input id="zipPasswordInput" class="input" type="password" placeholder="Enter your password" autocomplete="current-password" />
            <span class="input-icon">🔒</span>
          </div>
        </div>
        
        <div class="form-actions">
          <button id="unlockBtn" class="btn primary" type="button">
            <span class="btn-text">Sign In</span>
            <span class="btn-loader" style="display: none;">⟳</span>
          </button>
        </div>
      </form>
      
      <div class="login-help">
        <p>Don't have an account? Contact on WhatsApp <a href="https://wa.me/923339004564" target="_blank" class="whatsapp-link">+923339004564</a></p>
      </div>
      
      <div id="lockError" class="lock-error"></div>
    </div>
  </div>

  <div id="welcomeScreen" class="welcome-screen hide">
    <div class="welcome-content">
      <div class="welcome-logo">
        <img class="mark" src="Assets/logo/logo2.png" alt="Logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjMjQ1N2Q2IiByeD0iMTIiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSIxNiIgZmlsbD0iI2ZmZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXdlaWdodD0iYm9sZCI+TkY8L3RleHQ+PC9zdmc+'" />
      </div>
      <div class="welcome-text">
        <h1 class="welcome-title">Welcome Back</h1>
        <p class="welcome-name" id="welcomeName">User</p>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>Powered by Nadeem Shahzad Fida</p>
  </footer>

  <script src="Assets/app/login-script.js"></script>
</body>
</html>
