<script>
  const API_BASE      = "https://livenews.live/KFC";
  const PHOTOS_BASE   = `${API_BASE}/static/images/photos/`;
  const DEFAULT_PHOTO = `${PHOTOS_BASE}default.png`;
  const CARD_LOGO     = "logo.png";
  const EMIRATES_ZIP  = `emirates.zip`;

  const THEME_STORAGE_KEY       = "kfcTheme";
  const TRANSLATION_STORAGE_KEY = "kfcPageLanguage";

  let users       = [];
  let currentUser = null;

  let currentPageLanguage        = localStorage.getItem(TRANSLATION_STORAGE_KEY) === "ur" ? "ur" : "en";
  let googleTranslateLoadPromise = null;
  let translatePending           = null;
  let translationRefreshTimer    = null;
  let translationMutationObserver= null;
  let translationFixRunning      = false;

  let userArea, usernameText, dropdown, guestView, userView,
      openLoginBtn, loginOverlay, loginBtn, loginUsername, loginPassword,
      loginError, logoutBtn, userFullName, userCard, userDesg, userBlood,
      userMobile, welcomePopup, welcomeText,
      headerProfileImg, headerUserIcon, dropdownProfileImg,
      viewPhotoBtn, photoOverlay, fullProfileImg, closePhotoOverlay,
      notificationBtn, notiDropdown, notiBadge, notiList,
      msgBtn, msgDropdown, msgBadge, msgList,
      leadersOverlay, closeLeaders, leadersList,
      themeToggleBtn, themeToggleIcon,
      translateToggleBtn, translateToggleIcon, translateHost;

  function cacheElements() {
    userArea           = document.getElementById("userArea");
    usernameText       = document.getElementById("username");
    dropdown           = document.getElementById("userDropdown");
    guestView          = document.getElementById("guestView");
    userView           = document.getElementById("userView");
    openLoginBtn       = document.getElementById("openLoginBtn");
    loginOverlay       = document.getElementById("loginOverlay");
    loginBtn           = document.getElementById("loginBtn");
    loginUsername      = document.getElementById("loginUsername");
    loginPassword      = document.getElementById("loginPassword");
    loginError         = document.getElementById("loginError");
    logoutBtn          = document.getElementById("logoutBtn");
    userFullName       = document.getElementById("userFullName");
    userCard           = document.getElementById("userCard");
    userDesg           = document.getElementById("userDesg");
    userBlood          = document.getElementById("userBlood");
    userMobile         = document.getElementById("userMobile");
    welcomePopup       = document.getElementById("welcomePopup");
    welcomeText        = document.getElementById("welcomeText");
    headerProfileImg   = document.getElementById("headerProfileImg");
    headerUserIcon     = document.getElementById("headerUserIcon");
    dropdownProfileImg = document.getElementById("dropdownProfileImg");
    viewPhotoBtn       = document.getElementById("viewPhotoBtn");
    photoOverlay       = document.getElementById("photoOverlay");
    fullProfileImg     = document.getElementById("fullProfileImg");
    closePhotoOverlay  = document.getElementById("closePhotoOverlay");
    notificationBtn    = document.getElementById("notificationBtn");
    notiDropdown       = document.getElementById("notiDropdown");
    notiBadge          = document.getElementById("notiBadge");
    notiList           = document.getElementById("notiList");
    msgBtn             = document.getElementById("msgBtn");
    msgDropdown        = document.getElementById("msgDropdown");
    msgBadge           = document.getElementById("msgBadge");
    msgList            = document.getElementById("msgList");
    leadersOverlay     = document.getElementById("leadersOverlay");
    closeLeaders       = document.getElementById("closeLeaders");
    leadersList        = document.getElementById("leadersList");
    themeToggleBtn     = document.getElementById("themeToggleBtn");
    themeToggleIcon    = document.getElementById("themeToggleIcon");
    translateToggleBtn = document.getElementById("translateToggleBtn");
    translateToggleIcon= document.getElementById("translateToggleIcon");
    translateHost      = document.getElementById("google_translate_element");
  }

  function normalizeText(v) { return (v || "").toString().trim(); }

  function isCancelledStatus(s) {
    const v = normalizeText(s).toLowerCase();
    return v === "cancel" || v === "cancelled";
  }

  function generateUsername(name) {
    const parts = normalizeText(name).toLowerCase().split(/\s+/).filter(Boolean);
    if (parts.length < 2) return normalizeText(name).toLowerCase();
    return (parts[0] + parts[parts.length - 1]).replace(/\s/g, "");
  }

  function generatePassword(card) {
    if (!card) return "";
    const parts = String(card).split("-");
    return parts[parts.length - 1] || "";
  }

  function escapeHTML(str) {
    return String(str || "")
      .replaceAll("&","&amp;").replaceAll("<","&lt;")
      .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  function formatDateValue(v) { return normalizeText(v) || "No date"; }

  function buildCenteredInfoMessage(text) {
    return `<p style="text-align:center;padding:20px;color:#888;">${escapeHTML(text)}</p>`;
  }

  function safeCardNo(c) { return encodeURIComponent(String(c || "")); }

  function getCardImageCandidates(cardNo) {
    const c = safeCardNo(cardNo);
    return [`${PHOTOS_BASE}${c}.png`, `${PHOTOS_BASE}${c}.jpg`, DEFAULT_PHOTO];
  }

  function setImageWithFallback(img, sources, fallbackIconEl) {
    if (!img) return;
    let idx = 0;
    img.onerror = () => { tryNext(); };
    img.onload  = () => {
      img.style.display = "block";
      if (fallbackIconEl) fallbackIconEl.style.display = "none";
    };
    function tryNext() {
      if (idx >= sources.length) {
        img.style.display = "none";
        if (fallbackIconEl) fallbackIconEl.style.display = "block";
        return;
      }
      img.src = sources[idx++];
    }
    tryNext();
  }

  function applyProfileImage(cardNo) {
    const s = getCardImageCandidates(cardNo);
    setImageWithFallback(headerProfileImg, s, headerUserIcon);
    setImageWithFallback(dropdownProfileImg, s, null);
    setImageWithFallback(fullProfileImg, s, null);
  }

  function applyTheme(mode) {
    const dark = mode === "dark";
    document.body.classList.toggle("dark-mode", dark);
    localStorage.setItem(THEME_STORAGE_KEY, dark ? "dark" : "light");
    if (themeToggleIcon) {
      themeToggleIcon.className = dark ? "fa-solid fa-sun" : "fa-solid fa-moon";
    }
  }

  function initTheme() {
    const saved = localStorage.getItem(THEME_STORAGE_KEY);
    if (saved === "dark" || saved === "light") {
      applyTheme(saved);
      return;
    }
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme:dark)").matches;
    applyTheme(prefersDark ? "dark" : "light");
  }

  function toggleTheme() {
    applyTheme(document.body.classList.contains("dark-mode") ? "light" : "dark");
  }

  function setDocumentDirection() {
    const rtl = currentPageLanguage === "ur";
    document.documentElement.lang = rtl ? "ur" : "en";
    document.documentElement.dir  = rtl ? "rtl" : "ltr";
    document.body.classList.toggle("page-rtl", rtl);
    if (translateToggleBtn) {
      translateToggleBtn.classList.toggle("active", rtl);
      translateToggleBtn.setAttribute("aria-label", rtl ? "Switch to English" : "Translate page to Urdu");
      translateToggleBtn.title = rtl ? "Switch to English" : "Translate page to Urdu";
    }
  }

  function setPageLanguage(lang) {
    currentPageLanguage = lang === "ur" ? "ur" : "en";
    localStorage.setItem(TRANSLATION_STORAGE_KEY, currentPageLanguage);
    setDocumentDirection();
    scheduleTranslationNormalization();
  }

  function applyTranslationFixes(root = document.body) {
    if (!root || translationFixRunning) return;
    translationFixRunning = true;
    try {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      const replacements = currentPageLanguage === "ur"
        ? [["Khawrai Falahi Committee","خاورئی فلاحی کمیٹی"],["Khawarai Welfare Committee","خاورئی فلاحی کمیٹی"],["Khawrai","خاورئی"],["Constitution","دستور"]]
        : [["Khawarai Welfare Committee","Khawrai Falahi Committee"],["Khawarai Welfare Committee UAE","Khawrai Falahi Committee UAE"],["Recipe (English)","Constitution (English)"],["Order (Translated)","Constitution (Translated)"]];
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(n => {
        let t = n.nodeValue;
        if (!t) return;
        let u = t;
        replacements.forEach(([f,r]) => { if (u.includes(f)) u = u.split(f).join(r); });
        if (u !== t) n.nodeValue = u;
      });
    } finally {
      setTimeout(() => { translationFixRunning = false; }, 0);
    }
  }

  function scheduleTranslationNormalization() {
    clearTimeout(translationRefreshTimer);
    translationRefreshTimer = setTimeout(() => applyTranslationFixes(document.body), 120);
  }

  function refreshTranslatedView() { scheduleTranslationNormalization(); }

  function startTranslationObserver() {
    if (translationMutationObserver || !window.MutationObserver || !document.body) return;
    translationMutationObserver = new MutationObserver(() => {
      if (!translationFixRunning) scheduleTranslationNormalization();
    });
    translationMutationObserver.observe(document.body, { subtree:true, childList:true, characterData:true });
  }

  function applyGoogleTranslation(lang) {
    const combo = document.querySelector(".goog-te-combo");
    if (!combo) return false;
    combo.value = lang;
    combo.dispatchEvent(new Event("change"));
    setPageLanguage(lang);
    return true;
  }

  function applyGoogleTranslationWithRetry(lang, attempt = 0) {
    if (applyGoogleTranslation(lang)) {
      setTimeout(() => applyTranslationFixes(document.body), 250);
      return;
    }
    if (attempt < 20) setTimeout(() => applyGoogleTranslationWithRetry(lang, attempt + 1), 200);
    else translatePending = lang;
  }

  function ensureGoogleTranslateWidget() {
    if (googleTranslateLoadPromise) return googleTranslateLoadPromise;
    googleTranslateLoadPromise = new Promise((resolve, reject) => {
      if (window.google && window.google.translate && document.querySelector(".goog-te-combo")) {
        resolve();
        return;
      }
      window.googleTranslateElementInit = function () {
        try {
          if (translateHost) translateHost.innerHTML = "";
          new google.translate.TranslateElement(
            { pageLanguage:"en", includedLanguages:"ur,en", autoDisplay:false },
            "google_translate_element"
          );
          resolve();
          if (translatePending) {
            const p = translatePending;
            translatePending = null;
            setTimeout(() => applyGoogleTranslationWithRetry(p), 250);
          }
        } catch(e) {
          reject(e);
        }
      };
      if (document.getElementById("kfc-google-translate-script")) return;
      const s = document.createElement("script");
      s.id = "kfc-google-translate-script";
      s.src = "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
      s.async = true;
      s.onerror = () => reject(new Error("Translator unavailable"));
      document.head.appendChild(s);
    });
    return googleTranslateLoadPromise;
  }

  async function toggleTranslation() {
    const target = currentPageLanguage === "ur" ? "en" : "ur";
    translatePending = target;
    try {
      await ensureGoogleTranslateWidget();
      applyGoogleTranslationWithRetry(target);
    } catch(e) {
      console.error("Translation error:", e);
    }
  }

  function saveSession(u) { localStorage.setItem("kfcUser", JSON.stringify(u)); }
  function clearSession() { localStorage.removeItem("kfcUser"); }

  function showLoggedOutUI() {
    if (msgBtn) msgBtn.style.display = "none";
    if (notificationBtn) notificationBtn.style.display = "none";
    if (headerProfileImg) headerProfileImg.style.display = "none";
    if (headerUserIcon) headerUserIcon.style.display = "block";
    if (guestView) guestView.style.display = "block";
    if (userView) userView.style.display = "none";
    if (usernameText) usernameText.innerText = "Welcome, Guest";
  }

  function showLoggedInUI() {
    if (msgBtn) msgBtn.style.display = "flex";
    if (notificationBtn) notificationBtn.style.display = "flex";
    if (guestView) guestView.style.display = "none";
    if (userView) userView.style.display = "flex";
  }

  function renderUserToUI(user) {
    if (!user) return;
    const firstName = normalizeText(user.name).split(" ")[0] || "User";
    if (usernameText) usernameText.innerText = `Welcome, ${firstName}`;
    if (userFullName) userFullName.innerText = `Welcome, ${user.name}`;
    if (userCard)     userCard.innerText  = `Card Number: ${user.CNo}`;
    if (userDesg)     userDesg.innerText  = `Designation: ${user.Desg}`;
    if (userBlood)    userBlood.innerText = `Blood Group: ${user.BG || "Not available"}`;
    if (userMobile)   userMobile.innerText = `Registered Mobile: ${user.mobile || "Not available"}`;
    applyProfileImage(user.CNo);
    const vcb = document.getElementById("viewCardBtn");
    if (vcb) {
      vcb.href = `viewcard.html?card=${btoa(String(user.CNo))}`;
      vcb.target = "_blank";
    }
    showLoggedInUI();
    refreshTranslatedView();
  }

  function showWelcome(name) {
    if (!welcomePopup || !welcomeText) return;
    welcomeText.innerText = `Welcome, ${name} 👋`;
    welcomePopup.classList.add("show");
    setTimeout(() => welcomePopup.classList.remove("show"), 2500);
  }

  function login() {
    if (loginError) loginError.innerText = "";
    const uname = normalizeText(loginUsername?.value).toLowerCase();
    const pass  = normalizeText(loginPassword?.value);
    if (!uname || !pass) {
      if (loginError) loginError.innerText = "Enter username and password";
      return;
    }
    const user = users.find(u => generateUsername(u.name) === uname && generatePassword(u.CNo) === pass);
    if (!user) {
      if (loginError) loginError.innerText = "Invalid credentials";
      return;
    }
    if (isCancelledStatus(user.Status)) {
      if (loginError) loginError.innerText = "This account cannot log in because the card is cancelled";
      return;
    }
    currentUser = user;
    saveSession(user);
    renderUserToUI(user);
    showWelcome(user.name);
    if (loginOverlay) loginOverlay.classList.remove("show");
  }

  function checkSession() {
    const saved = localStorage.getItem("kfcUser");
    if (!saved) {
      currentUser = null;
      showLoggedOutUI();
      return;
    }
    try {
      const p = JSON.parse(saved);
      if (p && !isCancelledStatus(p.Status)) {
        currentUser = p;
        renderUserToUI(p);
      } else {
        clearSession();
        currentUser = null;
        showLoggedOutUI();
      }
    } catch(e) {
      clearSession();
      currentUser = null;
      showLoggedOutUI();
    }
  }

  async function loadUsers() {
    try {
      const r = await fetch(`${API_BASE}/cards.json`, { cache:"no-store" });
      users = await r.json();
    } catch(e) {
      console.error("Error loading users:", e);
    }
  }

  function createCardTopStripe() {
    const d = document.createElement("div");
    d.style.cssText = "background-color:#0d3c91;height:6px;";
    return d;
  }

  function createCardBackgroundLogo() {
    const img = document.createElement("img");
    img.src = CARD_LOGO;
    img.alt = "";
    img.setAttribute("aria-hidden","true");
    img.style.cssText = "position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60%;opacity:0.08;z-index:1;pointer-events:none;user-select:none;";
    return img;
  }

  async function fetchAlerts() {
    try {
      const res = await fetch(`${API_BASE}/message/alerts.json`, { cache:"no-store" });
      const alerts = await res.json();
      if (!notiList) return;
      notiList.innerHTML = "";
      if (!Array.isArray(alerts) || alerts.length === 0) {
        notiList.innerHTML = buildCenteredInfoMessage("No alerts found.");
        return;
      }
      const sorted = [...alerts].reverse();
      sorted.slice(0,3).forEach(a => {
        const item = document.createElement("div");
        item.className = "noti-item";
        item.style.cssText = "position:relative;background:#fff;border:1px solid #e0e0e0;border-radius:8px;margin-bottom:10px;overflow:hidden;";
        item.appendChild(createCardTopStripe());
        item.appendChild(createCardBackgroundLogo());
        const top = document.createElement("div");
        top.className = "noti-top-row";
        top.style.cssText = "padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2;cursor:pointer;";
        const t = document.createElement("span");
        t.style.cssText = "font-weight:bold;color:#0d3c91;font-size:15px;";
        t.textContent = normalizeText(a.title_en || a.title || "Alert");
        const ds = document.createElement("span");
        ds.style.cssText = "font-size:11px;color:#888;";
        ds.textContent = formatDateValue(a.date);
        top.appendChild(t);
        top.appendChild(ds);
        const body = document.createElement("div");
        body.className = "noti-body";
        body.style.cssText = "display:none;padding:15px;border-top:1px dashed #eee;white-space:pre-line;position:relative;z-index:2;font-size:14px;line-height:1.8;color:#333;";
        body.textContent = normalizeText(a.body_en || a.body || "");
        item.appendChild(top);
        item.appendChild(body);
        item.addEventListener("click", () => {
          const vis = body.style.display === "block";
          document.querySelectorAll(".noti-body").forEach(b => b.style.display = "none");
          if (!vis) body.style.display = "block";
        });
        notiList.appendChild(item);
      });
      const btn = document.createElement("div");
      btn.style.cssText = "margin-top:12px;text-align:center;";
      btn.innerHTML = `<button onclick="window.location.href='${API_BASE}/message/alerts.html'" style="width:100%;padding:10px 14px;border:none;border-radius:999px;background:linear-gradient(90deg,#ff6ec4,#7873f5);color:#fff;font-weight:bold;cursor:pointer;font-size:13px;">Click here to see all alerts</button>`;
      notiList.appendChild(btn);
    } catch(e) {
      if (notiList) notiList.innerHTML = buildCenteredInfoMessage("Error loading alerts.");
    }
  }

  async function fetchPersonalMessages() {
    try {
      const res = await fetch(`${API_BASE}/messages.json`, { cache:"no-store" });
      const msgs = await res.json();
      if (!msgList) return;
      msgList.innerHTML = "";
      if (!currentUser) {
        msgList.innerHTML = buildCenteredInfoMessage("Please sign in to view your messages");
        return;
      }
      const mine = (Array.isArray(msgs) ? msgs : []).filter(m => {
        const c = normalizeText(m.cardNumber).toLowerCase();
        return c === normalizeText(currentUser.CNo).toLowerCase() || c === "all";
      });
      if (mine.length === 0) {
        msgList.innerHTML = buildCenteredInfoMessage("No messages found.");
        return;
      }
      mine.sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));
      mine.forEach(msg => {
        const item = document.createElement("div");
        item.className = "noti-item msg-item";
        item.style.cssText = "position:relative;background:#fff;border:1px solid #e0e0e0;border-radius:8px;margin-bottom:10px;overflow:hidden;cursor:pointer;";
        item.appendChild(createCardTopStripe());
        item.appendChild(createCardBackgroundLogo());
        const top = document.createElement("div");
        top.style.cssText = "padding:12px 15px;display:flex;flex-direction:column;gap:4px;position:relative;z-index:2;";
        const ds = document.createElement("span");
        ds.style.cssText = "font-size:11px;color:#888;";
        ds.textContent = formatDateValue(msg.date);
        const tt = document.createElement("strong");
        tt.style.cssText = "color:#0d3c91;font-size:15px;";
        tt.textContent = normalizeText(msg.title_en || msg.title || "Message");
        top.appendChild(ds);
        top.appendChild(tt);
        const body = document.createElement("div");
        body.style.cssText = "display:none;padding:15px;border-top:1px dashed #ccc;position:relative;z-index:2;font-size:13px;color:#444;line-height:1.8;white-space:pre-line;";
        body.textContent = normalizeText(msg.body_en || msg.body || "");
        item.appendChild(top);
        item.appendChild(body);
        item.addEventListener("click", () => {
          const vis = body.style.display === "block";
          document.querySelectorAll(".msg-body").forEach(b => b.style.display = "none");
          if (!vis) body.style.display = "block";
        });
        msgList.appendChild(item);
      });
    } catch(e) {
      if (msgList) msgList.innerHTML = buildCenteredInfoMessage("Error loading messages.");
    }
  }

  function showLeaders() {
    if (!leadersList) return;
    leadersList.innerHTML = "";
    const roles = ["president","acting president","vice president","committee guardian","committee guardian (ex-pr)","general secretary","finance manager","joint finance secretary","media manager"];
    const leaders = users
      .filter(u => u.Desg && roles.includes(normalizeText(u.Desg).toLowerCase()))
      .sort((a,b) => roles.indexOf(normalizeText(a.Desg).toLowerCase()) - roles.indexOf(normalizeText(b.Desg).toLowerCase()));
    if (!leaders.length) {
      leadersList.innerHTML = `<p style="text-align:center;color:#888;padding:15px;">No leaders found.</p>`;
      return;
    }
    leaders.forEach(l => {
      const d = document.createElement("div");
      d.className = "leader-item";
      d.innerHTML = `<h4>${escapeHTML(l.name || "")}</h4>
        <p>${escapeHTML(l.Desg || "")}</p>
        <p class="leader-phone"><i class="fa-solid fa-phone"></i> ${escapeHTML(l.mobile || "Not available")}</p>`;
      leadersList.appendChild(d);
    });
  }

  function closeAllDropdowns() {
    if (dropdown) dropdown.classList.remove("show");
    if (notiDropdown) notiDropdown.classList.remove("show");
    if (msgDropdown) msgDropdown.classList.remove("show");
  }

  let eidPendingUser = null;
  let cachedZipBlob   = null;
  let currentObjectURL = null;

  const tabByName      = document.getElementById("tabByName");
  const tabByCard      = document.getElementById("tabByCard");
  const eidSearchInput = document.getElementById("eidSearchInput");
  const eidSearchBtn   = document.getElementById("eidSearchBtn");
  const eidSearchHint  = document.getElementById("eidSearchHint");
  const eidResultsArea = document.getElementById("eidResultsArea");

  const pwdOverlay     = document.getElementById("pwdOverlay");
  const pwdInput       = document.getElementById("pwdInput");
  const pwdEyeBtn      = document.getElementById("pwdEyeBtn");
  const pwdEyeIcon     = document.getElementById("pwdEyeIcon");
  const pwdSubmitBtn   = document.getElementById("pwdSubmitBtn");
  const pwdError       = document.getElementById("pwdError");
  const pwdCloseBtn    = document.getElementById("pwdCloseBtn");

  const eidViewerOverlay  = document.getElementById("eidViewerOverlay");
  const eidViewerClose    = document.getElementById("eidViewerClose");
  const eidViewerName     = document.getElementById("eidViewerName");
  const eidViewerCard     = document.getElementById("eidViewerCard");
  const eidImageContainer = document.getElementById("eidImageContainer");
  const eidDownloadBtn    = document.getElementById("eidDownloadBtn");

  function setSearchMode(mode) {
    eidSearchMode = mode;
    eidSearchInput.value = "";
    eidResultsArea.innerHTML = "";

    if (mode === "name") {
      tabByName.classList.add("active");
      tabByCard.classList.remove("active");
      tabByName.setAttribute("aria-selected","true");
      tabByCard.setAttribute("aria-selected","false");
      eidSearchInput.placeholder = "Enter full name to search…";
      eidSearchHint.textContent = "Tip: Enter at least 2 characters to search by name.";
    } else {
      tabByCard.classList.add("active");
      tabByName.classList.remove("active");
      tabByCard.setAttribute("aria-selected","true");
      tabByName.setAttribute("aria-selected","false");
      eidSearchInput.placeholder = "Enter card number e.g. 746-210-011";
      eidSearchHint.textContent = "Tip: Enter the full or partial card number.";
    }
    eidSearchInput.focus();
  }

  function buildEidInfoBox(icon, color, text) {
    return `
      <div class="eid-no-results">
        <i class="fa-solid ${escapeHTML(icon)}" style="font-size:36px;color:${escapeHTML(color)};margin-bottom:10px;display:block;"></i>
        <p>${escapeHTML(text)}</p>
      </div>`;
  }

  function buildResultCard(member) {
    const card = document.createElement("div");
    card.className = "eid-result-card";

    const info = document.createElement("div");
    info.className = "eid-result-info";

    const name = document.createElement("div");
    name.className = "eid-result-name";
    name.innerHTML = `<i class="fa-solid fa-user" style="margin-right:7px;color:#7873f5;font-size:14px;"></i>${escapeHTML(member.name || "—")}`;

    const meta = document.createElement("div");
    meta.className = "eid-result-meta";

    const cardSpan = document.createElement("span");
    cardSpan.innerHTML = `<i class="fa-solid fa-id-badge" style="color:#7873f5;"></i> ${escapeHTML(member.CNo || "—")}`;

    const desgSpan = document.createElement("span");
    desgSpan.innerHTML = `<i class="fa-solid fa-briefcase" style="color:#ff6ec4;"></i> ${escapeHTML(member.Desg || "—")}`;

    const statusSpan = document.createElement("span");
    const isActive = normalizeText(member.Status).toLowerCase() === "active";
    statusSpan.innerHTML = `<i class="fa-solid fa-circle" style="font-size:9px;color:${isActive ? "#38a169" : "#e53e3e"};"></i> ${escapeHTML(member.Status || "—")}`;

    meta.appendChild(cardSpan);
    meta.appendChild(desgSpan);
    meta.appendChild(statusSpan);

    info.appendChild(name);
    info.appendChild(meta);

    const btn = document.createElement("button");
    btn.className = "eid-view-btn";
    btn.type = "button";
    btn.innerHTML = `<i class="fa-solid fa-id-card"></i> View Emirates ID`;
    btn.addEventListener("click", () => openPasswordModal(member));

    card.appendChild(info);
    card.appendChild(btn);
    return card;
  }

  function performSearch() {
    const q = normalizeText(eidSearchInput.value).toLowerCase();
    eidResultsArea.innerHTML = "";

    if (q.length < 2) {
      eidResultsArea.innerHTML = buildEidInfoBox(
        "fa-circle-info", "#7873f5",
        "Please enter at least 2 characters to search."
      );
      return;
    }

    let results = [];
    if (eidSearchMode === "name") {
      results = users.filter(u => normalizeText(u.name).toLowerCase().includes(q));
    } else {
      results = users.filter(u => normalizeText(u.CNo).toLowerCase().includes(q));
    }

    if (results.length === 0) {
      eidResultsArea.innerHTML = buildEidInfoBox(
        "fa-user-slash", "#e53e3e",
        "No member found matching your search. Please check the input and try again."
      );
      return;
    }

    const countBadge = document.createElement("p");
    countBadge.style.cssText = "font-size:13px;color:#888;margin-bottom:12px;padding-left:4px;";
    countBadge.textContent = `${results.length} result${results.length !== 1 ? "s" : ""} found`;
    eidResultsArea.appendChild(countBadge);

    results.forEach(member => eidResultsArea.appendChild(buildResultCard(member)));
  }

  function openPasswordModal(member) {
    eidPendingUser = member;
    pwdInput.value = "";
    pwdError.textContent = "";
    pwdOverlay.classList.add("show");
    setTimeout(() => pwdInput.focus(), 100);
    closeAllDropdowns();
  }

  function closePwdModal() {
    pwdOverlay.classList.remove("show");
    eidPendingUser = null;
    pwdInput.value = "";
    pwdError.textContent = "";
  }

  pwdEyeBtn.addEventListener("click", () => {
    const hidden = pwdInput.type === "password";
    pwdInput.type = hidden ? "text" : "password";
    pwdEyeIcon.className = hidden ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
  });

  pwdCloseBtn.addEventListener("click", closePwdModal);

  pwdOverlay.addEventListener("click", e => {
    if (e.target === pwdOverlay) closePwdModal();
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      closePwdModal();
      closeEidViewer();
    }
    if (e.key === "Enter" && pwdOverlay.classList.contains("show")) {
      attemptUnlock();
    }
  });

  pwdSubmitBtn.addEventListener("click", attemptUnlock);

  async function getCachedZipBlob() {
    if (cachedZipBlob) return cachedZipBlob;

    const res = await fetch(EMIRATES_ZIP, { cache: "no-store" });
    if (!res.ok) {
      throw new Error(`Could not download the archive (HTTP ${res.status}).`);
    }
    cachedZipBlob = await res.blob();
    return cachedZipBlob;
  }

  function findArchiveEntry(entries, cardNo) {
    const wanted = [
      `${cardNo}.jpg`, `${cardNo}.jpeg`, `${cardNo}.png`,
      `${cardNo}.JPG`, `${cardNo}.JPEG`, `${cardNo}.PNG`
    ];

    for (const name of wanted) {
      const hit = entries.find(e => !e.directory && normalizeText(e.filename || e.name || "").split("/").pop() === name);
      if (hit) return hit;
    }

    const lowerCard = cardNo.toLowerCase();
    return entries.find(e => {
      if (e.directory) return false;
      const base = normalizeText(e.filename || e.name || "").split("/").pop().toLowerCase();
      const withoutExt = base.replace(/\.(jpg|jpeg|png)$/i, "");
      return withoutExt === lowerCard;
    }) || null;
  }

  async function attemptUnlock() {
    if (!eidPendingUser) return;

    const password = normalizeText(pwdInput.value);
    if (!password) {
      pwdError.textContent = "Please enter the password.";
      return;
    }

    pwdSubmitBtn.innerHTML = `<span class="btn-spinner"></span> Unlocking…`;
    pwdSubmitBtn.disabled = true;
    pwdError.textContent = "";

    const member = eidPendingUser;
    const cardNo = normalizeText(member.CNo);

    let zipReader = null;

    try {
      const zipBlob = await getCachedZipBlob();

      zipReader = new zip.ZipReader(
        new zip.BlobReader(zipBlob),
        { password }
      );

      const entries = await zipReader.getEntries();
      const foundEntry = findArchiveEntry(entries, cardNo);

      if (!foundEntry) {
        throw new Error(
          `No Emirates ID image found for card ${cardNo} inside the archive. Expected: ${cardNo}.jpg or ${cardNo}.png`
        );
      }

      const entryName = normalizeText(foundEntry.filename || foundEntry.name || "");
      const ext = entryName.split(".").pop().toLowerCase();
      const mimeType = ext === "png" ? "image/png" : "image/jpeg";

      const imageBlob = await foundEntry.getData(
        new zip.BlobWriter(mimeType),
        { password, checkSignature: true }
      );

      const objectURL = URL.createObjectURL(imageBlob);

      closePwdModal();
      openEidViewer(member, objectURL, ext);

    } catch (err) {
      const msg = String(err?.message || err || "An error occurred. Please try again.");
      if (/password|decrypt|encrypted/i.test(msg)) {
        pwdError.textContent = "Incorrect password. Please try again.";
      } else {
        pwdError.textContent = msg;
      }
      cachedZipBlob = null;
    } finally {
      if (zipReader) {
        try { await zipReader.close(); } catch (_) {}
      }
      pwdSubmitBtn.innerHTML = `<i class="fa-solid fa-unlock"></i> Unlock &amp; View ID`;
      pwdSubmitBtn.disabled = false;
    }
  }

  function openEidViewer(member, objectURL, ext) {
    if (currentObjectURL) URL.revokeObjectURL(currentObjectURL);
    currentObjectURL = objectURL;

    eidViewerName.textContent = member.name || "—";
    eidViewerCard.textContent = `Card No: ${member.CNo || "—"} · ${member.Desg || "—"}`;

    eidImageContainer.innerHTML = `
      <div class="eid-loading-spinner">
        <i class="fa-solid fa-spinner"></i>
        <p>Loading Emirates ID image…</p>
      </div>`;
    eidDownloadBtn.style.display = "none";
    eidViewerOverlay.classList.add("show");

    const img = document.createElement("img");
    img.alt = `Emirates ID of ${member.name}`;
    img.style.cssText = "width:100%;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,0.14);display:block;";

    img.onload = () => {
      eidImageContainer.innerHTML = "";
      eidImageContainer.appendChild(img);
      eidDownloadBtn.style.display = "inline-flex";
    };

    img.onerror = () => {
      eidImageContainer.innerHTML = `
        <div class="eid-load-error">
          <i class="fa-solid fa-triangle-exclamation" style="font-size:36px;margin-bottom:10px;display:block;"></i>
          <p>Failed to display the image. The file may be corrupted.</p>
        </div>`;
    };

    img.src = objectURL;

    eidDownloadBtn.onclick = () => {
      const a = document.createElement("a");
      a.href = objectURL;
      a.download = `EmiratesID_${normalizeText(member.CNo)}.${ext}`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    };
  }

  function closeEidViewer() {
    eidViewerOverlay.classList.remove("show");
    if (currentObjectURL) {
      URL.revokeObjectURL(currentObjectURL);
      currentObjectURL = null;
    }
    eidImageContainer.innerHTML = "";
    eidDownloadBtn.style.display = "none";
  }

  eidViewerClose.addEventListener("click", closeEidViewer);
  eidViewerOverlay.addEventListener("click", e => {
    if (e.target === eidViewerOverlay) closeEidViewer();
  });

  function bindEvents() {
    if (userArea) {
      userArea.addEventListener("click", e => {
        e.stopPropagation();
        if (notiDropdown) notiDropdown.classList.remove("show");
        if (msgDropdown) msgDropdown.classList.remove("show");
        if (dropdown) dropdown.classList.toggle("show");
      });
    }

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener("click", e => { e.stopPropagation(); toggleTheme(); });
    }

    if (translateToggleBtn) {
      translateToggleBtn.addEventListener("click", e => { e.stopPropagation(); toggleTranslation(); });
    }

    if (notificationBtn) {
      notificationBtn.addEventListener("click", e => {
        e.stopPropagation();
        if (dropdown) dropdown.classList.remove("show");
        if (msgDropdown) msgDropdown.classList.remove("show");
        if (notiDropdown) notiDropdown.classList.toggle("show");
        if (!currentUser) {
          if (notiList) notiList.innerHTML = buildCenteredInfoMessage("Please sign in to view recent alerts");
          if (notiBadge) notiBadge.style.display = "none";
          return;
        }
        fetchAlerts();
        if (notiBadge) notiBadge.style.display = "none";
      });
    }

    if (msgBtn) {
      msgBtn.addEventListener("click", e => {
        e.stopPropagation();
        if (dropdown) dropdown.classList.remove("show");
        if (notiDropdown) notiDropdown.classList.remove("show");
        if (msgDropdown) msgDropdown.classList.toggle("show");
        if (!currentUser) {
          if (msgList) msgList.innerHTML = buildCenteredInfoMessage("Please sign in to view your messages");
          if (msgBadge) msgBadge.style.display = "none";
          return;
        }
        fetchPersonalMessages();
      });
    }

    if (viewPhotoBtn) {
      viewPhotoBtn.addEventListener("click", () => {
        if (photoOverlay) photoOverlay.classList.add("show");
        if (dropdown) dropdown.classList.remove("show");
      });
    }

    if (closePhotoOverlay) {
      closePhotoOverlay.addEventListener("click", () => {
        if (photoOverlay) photoOverlay.classList.remove("show");
      });
    }

    if (photoOverlay) {
      photoOverlay.addEventListener("click", e => {
        if (e.target === photoOverlay) photoOverlay.classList.remove("show");
      });
    }

    document.addEventListener("click", () => closeAllDropdowns());

    [dropdown, notiDropdown, msgDropdown].forEach(box => {
      if (box) box.addEventListener("click", e => e.stopPropagation());
    });

    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => { clearSession(); currentUser = null; location.reload(); });
    }

    if (openLoginBtn) {
      openLoginBtn.addEventListener("click", () => { if (loginOverlay) loginOverlay.classList.add("show"); });
    }

    if (loginOverlay) {
      loginOverlay.addEventListener("click", e => { if (e.target === loginOverlay) loginOverlay.classList.remove("show"); });
    }

    if (loginBtn) loginBtn.addEventListener("click", login);

    document.addEventListener("keydown", e => {
      if (e.key === "Enter" && loginOverlay && loginOverlay.classList.contains("show")) login();
    });

    if (leadersOverlay && closeLeaders && leadersList) {
      closeLeaders.addEventListener("click", e => { e.stopPropagation(); leadersOverlay.classList.remove("show"); });
      leadersOverlay.addEventListener("click", e => { if (e.target === leadersOverlay) leadersOverlay.classList.remove("show"); });
    }

    tabByName.addEventListener("click", () => setSearchMode("name"));
    tabByCard.addEventListener("click", () => setSearchMode("card"));

    eidSearchBtn.addEventListener("click", performSearch);

    eidSearchInput.addEventListener("keydown", e => {
      if (e.key === "Enter") performSearch();
    });

    let liveTimer = null;
    eidSearchInput.addEventListener("input", () => {
      clearTimeout(liveTimer);
      liveTimer = setTimeout(() => {
        if (eidSearchInput.value.trim().length >= 2) performSearch();
        else eidResultsArea.innerHTML = "";
      }, 320);
    });

    window.addEventListener("load", () => document.body.classList.add("loaded"));
  }

  async function init() {
    cacheElements();
    initTheme();
    setDocumentDirection();
    bindEvents();
    startTranslationObserver();

    if (currentPageLanguage === "ur") {
      ensureGoogleTranslateWidget()
        .then(() => applyGoogleTranslationWithRetry("ur"))
        .catch(e => console.error("Translator init error:", e));
    }

    await loadUsers();
    checkSession();
    scheduleTranslationNormalization();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
</script>
