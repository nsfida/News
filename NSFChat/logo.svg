<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Main chat bubble -->
  <path d="M 40 58 Q 40 38 60 38 L 152 38 Q 172 38 172 58 L 172 118 Q 172 138 152 138 L 98 138 L 68 162 L 68 138 L 60 138 Q 40 138 40 118 Z"
        fill="url(#bubbleGrad)" opacity="0.95"/>

  <!-- N letter mark -->
  <text x="100" y="105" font-family="'Arial Black', 'Helvetica Neue', sans-serif"
        font-size="56" font-weight="900" fill="#6366f1"
        text-anchor="middle" letter-spacing="-2">N</text>

  <!-- Small dot indicators (typing dots aesthetic) -->
  <circle cx="76" cy="108" r="5" fill="#6366f1" opacity="0.5"/>
  <circle cx="93" cy="108" r="5" fill="#6366f1" opacity="0.5"/>
  <!-- Actually the N is large enough, remove dots -->
</svg>
