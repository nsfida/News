<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>VoiceLink</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #08080f;
      --bg2: #0f0f1a;
      --card: #13131f;
      --card2: #1a1a2c;
      --border: rgba(255,255,255,0.07);
      --accent: #6c63ff;
      --accent2: #00d4aa;
      --green: #00c896;
      --red: #ff4d6a;
      --txt: #f0f0ff;
      --txt2: #8888aa;
      --txt3: #55556a;
      --glow: rgba(108,99,255,0.35);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--txt);
      font-family: 'DM Sans', sans-serif;
    }

    .screen {
      display: none;
      position: fixed;
      inset: 0;
      flex-direction: column;
      overflow: hidden;
    }

    .screen.active {
      display: flex;
    }

    .screen::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
    }

    #auth-screen {
      background: radial-gradient(ellipse at 30% 20%, rgba(108,99,255,0.12) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 80%, rgba(0,212,170,0.08) 0%, transparent 50%),
                  var(--bg);
      overflow-y: auto;
      align-items: center;
      justify-content: center;
    }

    .auth-wrap {
      width: 100%;
      max-width: 420px;
      padding: 60px 28px 40px;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      justify-content: center;
    }

    .brand {
      text-align: center;
      margin-bottom: 48px;
    }

    .brand-mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 40px var(--glow), 0 4px 12px rgba(0,0,0,0.4);
    }

    .brand-mark svg {
      width: 36px;
      height: 36px;
    }

    .brand-title {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 40%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      color: var(--txt2);
      font-size: 14px;
      margin-top: 6px;
      font-weight: 400;
    }

    .tab-bar {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 5px;
      margin-bottom: 28px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--txt2);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 16px var(--glow);
    }

    .form-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--txt3);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      padding: 15px 18px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 13px;
      color: var(--txt);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
    }

    .field input::placeholder {
      color: var(--txt3);
    }

    .err-box {
      background: rgba(255,77,106,0.1);
      border: 1px solid rgba(255,77,106,0.25);
      color: #ff8fa3;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
    }

    .btn-main {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px var(--glow);
      transition: transform 0.15s, box-shadow 0.15s;
      margin-top: 8px;
    }

    .btn-main:active {
      transform: scale(0.97);
      box-shadow: 0 4px 12px var(--glow);
    }

    #home-screen {
      background: var(--bg);
      overflow-y: auto;
    }

    .home-hero {
      background: linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
      padding: 56px 24px 28px;
    }

    .home-toprow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      gap: 16px;
    }

    .greeting {
      font-size: 13px;
      color: var(--txt2);
      margin-bottom: 2px;
    }

    .username-display {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .avatar-lg {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 4px 16px var(--glow);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(0,200,150,0.1);
      border: 1px solid rgba(0,200,150,0.2);
      color: var(--green);
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulseDot 2s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .home-body {
      padding: 32px 24px;
    }

    .call-card {
      background: linear-gradient(135deg, rgba(108,99,255,0.15), rgba(0,212,170,0.08));
      border: 1px solid rgba(108,99,255,0.25);
      border-radius: 22px;
      padding: 32px 24px;
      text-align: center;
      margin-bottom: 28px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
    }

    .call-card:active {
      transform: scale(0.98);
    }

    .call-ring {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      position: relative;
    }

    .call-ring::before, .call-ring::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1.5px solid rgba(108,99,255,0.3);
      animation: ringPulse 2s ease-out infinite;
    }

    .call-ring::after {
      animation-delay: 0.7s;
    }

    @keyframes ringPulse {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.4); }
    }

    .call-circle {
      width: 88px;
      height: 88px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 40px var(--glow);
    }

    .call-circle svg {
      width: 40px;
      height: 40px;
    }

    .call-card h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .call-card p {
      font-size: 14px;
      color: var(--txt2);
      font-weight: 400;
    }

    .divider-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .divider-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--txt3);
      white-space: nowrap;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .signout-btn {
      width: 100%;
      padding: 15px;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 13px;
      color: var(--txt2);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .signout-btn:hover {
      border-color: var(--red);
      color: var(--red);
    }

    #search-screen {
      background: var(--bg);
    }

    .search-top {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 56px 24px 22px;
    }

    .back-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      cursor: pointer;
      width: fit-content;
    }

    .back-row span {
      font-size: 15px;
      color: var(--accent2);
      font-weight: 500;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 18px;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    .search-field {
      flex: 1;
      padding: 14px 16px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 13px;
      color: var(--txt);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-field:focus {
      border-color: var(--accent);
    }

    .search-field::placeholder {
      color: var(--txt3);
    }

    .search-go {
      padding: 14px 20px;
      background: var(--accent);
      border: none;
      border-radius: 13px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--glow);
    }

    .search-results {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    .empty-state {
      text-align: center;
      margin-top: 60px;
      color: var(--txt3);
      font-size: 15px;
    }

    .empty-state svg {
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .result-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 10px;
      transition: border-color 0.15s;
    }

    .result-card:hover {
      border-color: rgba(108,99,255,0.3);
    }

    .av-sm {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .result-info {
      flex: 1;
    }

    .result-info h4 {
      font-size: 15px;
      font-weight: 600;
    }

    .result-info p {
      font-size: 12px;
      color: var(--txt2);
      margin-top: 2px;
    }

    .call-now-btn {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--green), #00a67e);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,200,150,0.35);
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .call-now-btn:active {
      transform: scale(0.9);
    }

    #incoming-screen {
      background: radial-gradient(ellipse at center top, rgba(108,99,255,0.22) 0%, transparent 60%),
                  linear-gradient(180deg, #110f22 0%, var(--bg) 50%);
      align-items: center;
      justify-content: space-between;
      padding: 90px 40px 80px;
    }

    .ring-caller {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin-top: auto;
      margin-bottom: auto;
    }

    .ring-avatar-wrap {
      position: relative;
      width: 130px;
      height: 130px;
    }

    .ring-ripple {
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      border: 1.5px solid rgba(108,99,255,0.35);
      animation: ripple 2.5s ease-out infinite;
    }

    .ring-ripple:nth-child(2) { animation-delay: 0.75s; }
    .ring-ripple:nth-child(3) { animation-delay: 1.5s; }

    @keyframes ripple {
      0% { opacity: 1; transform: scale(0.8); }
      100% { opacity: 0; transform: scale(1.5); }
    }

    .ring-avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      font-weight: 700;
      color: #fff;
      position: relative;
      z-index: 1;
      box-shadow: 0 16px 60px var(--glow);
    }

    .ring-name {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-align: center;
    }

    .ring-status {
      font-size: 15px;
      color: var(--txt2);
      text-align: center;
      animation: blink 1.8s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .ring-actions {
      display: flex;
      gap: 56px;
      align-items: center;
    }

    .ring-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .ring-btn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .ring-btn:active {
      transform: scale(0.92);
    }

    .ring-btn.accept {
      background: linear-gradient(135deg, #00c896, #009975);
      box-shadow: 0 8px 28px rgba(0,200,150,0.45);
    }

    .ring-btn.decline {
      background: linear-gradient(135deg, var(--red), #cc2e48);
      box-shadow: 0 8px 28px rgba(255,77,106,0.4);
    }

    .ring-btn-label {
      font-size: 12px;
      color: var(--txt2);
      font-weight: 500;
    }

    #incall-screen {
      background: radial-gradient(ellipse at center top, rgba(0,200,150,0.15) 0%, transparent 55%),
                  linear-gradient(180deg, #060f10 0%, var(--bg) 50%);
      align-items: center;
      justify-content: space-between;
      padding: 90px 40px 80px;
    }

    .call-peer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .call-av {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00c896, #0096d6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 16px 60px rgba(0,200,150,0.4);
      animation: callGlow 3s ease-in-out infinite;
    }

    @keyframes callGlow {
      0%, 100% { box-shadow: 0 16px 60px rgba(0,200,150,0.3); }
      50% { box-shadow: 0 16px 80px rgba(0,200,150,0.55); }
    }

    .call-peer-name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.4px;
      text-align: center;
    }

    .call-timer {
      font-family: 'DM Mono', monospace;
      font-size: 20px;
      color: var(--green);
      font-weight: 500;
      letter-spacing: 1px;
    }

    .controls-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 280px;
    }

    .ctrl-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .ctrl-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--card2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .ctrl-btn.on {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 4px 16px var(--glow);
    }

    .ctrl-btn.end {
      background: linear-gradient(135deg, var(--red), #cc2e48);
      border-color: transparent;
      width: 72px;
      height: 72px;
      box-shadow: 0 8px 24px rgba(255,77,106,0.4);
    }

    .ctrl-btn:active {
      transform: scale(0.92);
    }

    .ctrl-label {
      font-size: 11px;
      color: var(--txt2);
      font-weight: 500;
    }

    #loader {
      position: fixed;
      inset: 0;
      background: rgba(8,8,15,0.8);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      z-index: 9000;
    }

    #loader.on {
      display: flex;
    }

    .spin {
      width: 44px;
      height: 44px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loader p {
      font-size: 14px;
      color: var(--txt2);
    }

    #toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--card2);
      border: 1px solid var(--border);
      color: var(--txt);
      padding: 12px 22px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    ::-webkit-scrollbar {
      width: 0;
    }

    @media (max-width: 480px) {
      .auth-wrap, .home-hero, .search-top, .home-body, .search-results, #incoming-screen, #incall-screen {
        padding-left: 18px;
        padding-right: 18px;
      }

      .ring-actions {
        gap: 32px;
      }

      .controls-grid {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

<div id="loader">
  <div class="spin"></div>
  <p id="loader-txt">Loading…</p>
</div>

<div id="toast"></div>

<audio id="remote-audio" autoplay playsinline></audio>

<div class="screen active" id="auth-screen">
  <div class="auth-wrap">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 36 36" fill="none">
          <path d="M7 10C7 7.79 8.79 6 11 6h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-1a10 10 0 0 0 10 10v-1a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4c0 2.21-1.79 4-4 4A22 22 0 0 1 7 10z" fill="#fff"/>
        </svg>
      </div>
      <div class="brand-title">VoiceLink</div>
      <div class="brand-sub">Crystal clear internet calls</div>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div id="auth-err" class="err-box"></div>

    <div id="login-form" class="form-body">
      <div class="field">
        <label>Username</label>
        <input id="l-user" type="text" placeholder="your_username" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="field">
        <label>Password</label>
        <input id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn-main" onclick="doLogin()">Sign In →</button>
    </div>

    <div id="signup-form" class="form-body" style="display:none">
      <div class="field">

function normalizeUsername(value) {
  return String(value || '')
    .trim()
    .toLowerCase()
    .replace(/\s+/g, '_')
    .replace(/[^a-z0-9_]/g, '');
}

function emailFromUsername(username) {

}

function initials(name) {
  const value = String(name || '?').trim();
  return value ? value[0].toUpperCase() : '?';
}

function showScreen(id) {

}

function load(on, txt = 'Loading…') {
  document.getElementById('loader-txt').textContent = txt;

let toastTm = null;

  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTm);
  toastTm = setTimeout(() => t.classList.remove('show'), dur);

function setErr(msg) {
  const e = document.getElementById('auth-err');

    return;

  e.style.display = 'block';
}

function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');

  document.getElementById('signup-form').style.display = tab === 'signup' ? 'flex' : 'none';
  setErr('');
}

}

function setIncomingHeader(name) {
  document.getElementById('inc-name').textContent = name || 'Caller';
  document.getElementById('inc-avatar').textContent = initials(name);
}

function waitForSubscribed(channel) {
  return new Promise((resolve, reject) => {
    let done = false;
    channel.subscribe((status) => {
      if (done) return;
      if (status === 'SUBSCRIBED') {
        done = true;
        resolve();
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        done = true;
        reject(new Error('Realtime channel failed.'));
      }
    });
  });
}

async function ensureProfileRow(user, username) {

    is_online: true

  const { error } = await sb.from('profiles').upsert(payload, { onConflict: 'id' });

}

async function setOnlineState(isOnline) {
  if (!me) return;

    .from('profiles')
    .update({

    .eq('id', me.id);

}

function startOnlinePulse() {
  stopOnlinePulse();
  onlinePulse = setInterval(() => {

}

function stopOnlinePulse() {
  if (onlinePulse) {
    clearInterval(onlinePulse);
    onlinePulse = null;

}

      </svg>
    `;

async function doSignup() {
  if (authBusy) return;

  const u = normalizeUsername(document.getElementById('s-user').value);
  const p = document.getElementById('s-pass').value;
  const c = document.getElementById('s-conf').value;

  if (!u || !p || !c) return setErr('Please fill all fields.');
  if (u.length < 3) return setErr('Username must be at least 3 characters.');
  if (!/^[a-z0-9_]+$/.test(u)) return setErr('Only letters, numbers and underscores are allowed.');
  if (p.length < 6) return setErr('Password must be at least 6 characters.');
  if (p !== c) return setErr('Passwords do not match.');

  authBusy = true;
  setErr('');
  load(true, 'Creating account…');

  try {
    const email = emailFromUsername(u);

    const { data, error } = await sb.auth.signUp({
      email,
      password: p,
      options: {
        data: {
          username: u,
          display_name: u
        }
      }
    });

    if (error) throw error;

    if (data?.user) {
      await ensureProfileRow(data.user, u);
    }

    load(false);
    authBusy = false;

    if (data?.session) {
      await enterApp(data.user, u);
      toast('Account created');
    } else {
      setErr('Account created. If Confirm email is still on, sign in will wait for verification.');
      toast('Account created');
      switchTab('login');
      document.getElementById('l-user').value = u;
      document.getElementById('l-pass').value = '';
    }
  } catch (err) {
    load(false);
    authBusy = false;
    setErr(err.message || 'Signup failed.');
  }
}

async function doLogin() {
  if (authBusy) return;

  const u = normalizeUsername(document.getElementById('l-user').value);
  const p = document.getElementById('l-pass').value;

  if (!u || !p) return setErr('Please fill all fields.');

  authBusy = true;
  setErr('');
  load(true, 'Signing in…');

  try {
    const email = emailFromUsername(u);
    const { data, error } = await sb.auth.signInWithPassword({
      email,
      password: p
    });

    if (error) throw error;

    const username = await loadProfile(data.user, u);
    await ensureOwnProfile(data.user, username);

    load(false);
    authBusy = false;
    await enterApp(data.user, username);
  } catch (err) {
    load(false);
    authBusy = false;

    const msg = String(err?.message || 'Invalid credentials.');
    if (msg.toLowerCase().includes('email not confirmed')) {
      setErr('Email confirmation is still enabled in Supabase.');
    } else if (msg.toLowerCase().includes('invalid login credentials')) {
      setErr('Invalid credentials.');
    } else {
      setErr(msg);
    }
  }
}

async function loadProfile(user, fallbackUsername = '') {
  for (let i = 0; i < 3; i++) {
    const { data, error } = await sb.from('profiles').select('username').eq('id', user.id).maybeSingle();
    if (data?.username) return normalizeUsername(data.username);
    if (error) console.warn(error);
    await new Promise(r => setTimeout(r, 250));
  }
  return normalizeUsername(fallbackUsername || user.email?.split('@')[0] || 'user');
}

async function ensureOwnProfile(user, username) {
  const payload = {
    id: user.id,
    username: normalizeUsername(username || user.email?.split('@')[0] || 'user'),
    display_name: normalizeUsername(username || user.email?.split('@')[0] || 'user'),
    is_online: true,
    last_seen: new Date().toISOString(),
    updated_at: new Date().toISOString()
  };

  const { error } = await sb.from('profiles').upsert(payload, { onConflict: 'id' });
  if (error) throw error;
}

async function enterApp(user, username) {
  me = user;
  myName = normalizeUsername(username || user?.user_metadata?.username || user?.email?.split('@')[0] || '');
  setHomeHeader(myName);
  showScreen('home-screen');
  attachInbox();
  await setOnlineState(true);
  startOnlinePulse();
}

function attachInbox() {
  if (!me) return;

  if (inboxChannel) {
    sb.removeChannel(inboxChannel);
    inboxChannel = null;
  }

  inboxChannel = sb.channel(`user:${me.id}`, { config: { broadcast: { self: false } } })
    .on('broadcast', { event: 'call_offer' }, ({ payload }) => {
      onIncomingCall(payload);
    })
    .on('broadcast', { event: 'call_answer' }, async ({ payload }) => {
      if (!pc || !payload?.sdp) return;
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
        flushPendingIce();
      } catch (e) {
        console.error(e);
      }
    })
    .on('broadcast', { event: 'call_ice' }, async ({ payload }) => {
      if (!payload?.c) return;
      try {
        if (pc && pc.remoteDescription) {
          await pc.addIceCandidate(new RTCIceCandidate(payload.c));
        } else {
          pendingIce.push(payload.c);
        }
      } catch (e) {}
    })
    .on('broadcast', { event: 'call_rejected' }, () => {
      toast('Call declined');
      endCurrentCall(false);
      showScreen('home-screen');
    })
    .on('broadcast', { event: 'call_ended' }, () => {
      toast('Call ended');
      endCurrentCall(false);
      showScreen('home-screen');
    })
    .subscribe();
}

function flushPendingIce() {
  if (!pc || !pendingIce.length) return;
  const queue = pendingIce.slice();
  pendingIce = [];
  queue.forEach(async c => {
    try {
      await pc.addIceCandidate(new RTCIceCandidate(c));
    } catch (e) {}
  });
}

function makePeer() {
  const peer = new RTCPeerConnection(ICE_CFG);

  peer.onicecandidate = async ({ candidate }) => {
    if (!candidate || !callChannel) return;
    try {
      await callChannel.send({
        type: 'broadcast',
        event: 'call_ice',
        payload: { c: candidate.toJSON() }
      });
    } catch (e) {}
  };

  peer.ontrack = (e) => {
    const audio = document.getElementById('remote-audio');
    audio.srcObject = e.streams[0];
    audio.play().catch(() => {});
  };

  peer.onconnectionstatechange = () => {
    const state = peer.connectionState;
    if (state === 'connected' && !callStarted) {
      callStarted = true;
      startTimer();
      if (callTimeout) {
        clearTimeout(callTimeout);
        callTimeout = null;
      }
      document.getElementById('ic-timer').textContent = '00:00';
    }

    if (state === 'failed' || state === 'disconnected' || state === 'closed') {
      if (callStarted) toast('Call ended');
      endCurrentCall(false);
      showScreen('home-screen');
    }
  };

  return peer;
}

async function getMic() {
  try {
    return await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (e) {
    toast('Microphone access is required');
    throw new Error('mic_denied');
  }
}

async function doSearch() {
  if (!me) return;
  const q = normalizeUsername(document.getElementById('search-in').value);
  const box = document.getElementById('search-results');

  if (!q) {
    box.innerHTML = `<div class="empty-state"><p>Type a username first</p></div>`;
    return;
  }

  box.innerHTML = `<div class="empty-state"><p>Searching…</p></div>`;

  try {
    const { data, error } = await sb
      .from('profiles')
      .select('id, username, is_online')
      .ilike('username', `%${q}%`)
      .neq('id', me.id)
      .order('username', { ascending: true })
      .limit(15);

    if (error) throw error;
    renderSearchResults(data || []);
  } catch (err) {
    box.innerHTML = `<div class="empty-state"><p>Search failed</p></div>`;
  }
}

async function startCall(targetId, targetName) {
  if (!me) return;
  if (pc || callChannel || localStream) {
    toast('A call is already active');
    return;
  }

  load(true, 'Starting call…');
  callStarted = false;
  pendingIce = [];

  try {
    localStream = await getMic();
    activeCallId = crypto.randomUUID();

    callChannel = sb.channel(`call:${activeCallId}`, { config: { broadcast: { self: false } } })
      .on('broadcast', { event: 'call_answer' }, async ({ payload }) => {
        if (!pc || !payload?.sdp) return;
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
          flushPendingIce();
        } catch (e) {
          console.error(e);
        }
      })
      .on('broadcast', { event: 'call_ice' }, async ({ payload }) => {
        if (!payload?.c) return;
        try {
          if (pc && pc.remoteDescription) {
            await pc.addIceCandidate(new RTCIceCandidate(payload.c));
          } else {
            pendingIce.push(payload.c);
          }
        } catch (e) {}
      })
      .on('broadcast', { event: 'call_rejected' }, () => {
        toast(`${targetName} declined the call`);
        endCurrentCall(false);
        showScreen('home-screen');
      })
      .on('broadcast', { event: 'call_ended' }, () => {
        toast('Call ended');
        endCurrentCall(false);
        showScreen('home-screen');
      });

    await waitForSubscribed(callChannel);

    pc = makePeer();
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const inbox = sb.channel(`user:${targetId}`, { config: { broadcast: { self: false } } });
    await waitForSubscribed(inbox);

    const result = await inbox.send({
      type: 'broadcast',
      event: 'call_offer',
      payload: {
        callId: activeCallId,
        callerId: me.id,
        callerName: myName,
        sdp: pc.localDescription.toJSON()
      }
    });

    await sb.removeChannel(inbox);

    if (result?.error) throw result.error;

    setCallHeader(targetName);
    document.getElementById('ic-timer').textContent = 'Calling…';
    showScreen('incall-screen');
    load(false);

    callTimeout = setTimeout(async () => {
      if (!callStarted) {
        toast('No answer');
        await doEndCall();
      }
    }, 45000);
  } catch (err) {
    load(false);
    toast('Could not start call');
    await endCurrentCall(false);
  }
}

function onIncomingCall(payload) {
  if (!payload?.callId || !payload?.callerName || !payload?.sdp) return;

  if (pc || localStream || callChannel) {
    replyBusy(payload.callId);
    return;
  }

  pendingCall = {
    callId: payload.callId,
    callerId: payload.callerId,
    callerName: payload.callerName,
    sdp: payload.sdp
  };

  setIncomingHeader(payload.callerName);
  showScreen('incoming-screen');
  playRing();
}

async function replyBusy(callId) {
  try {
    const ch = sb.channel(`call:${callId}`, { config: { broadcast: { self: false } } });
    await waitForSubscribed(ch);
    await ch.send({
      type: 'broadcast',
      event: 'call_rejected',
      payload: { reason: 'busy' }
    });
    await sb.removeChannel(ch);
  } catch (e) {}
}

async function acceptCall() {
  if (!pendingCall) return;

  stopRing();
  load(true, 'Connecting…');

  try {
    activeCallId = pendingCall.callId;
    localStream = await getMic();
    pendingIce = [];
    callStarted = false;

    callChannel = sb.channel(`call:${activeCallId}`, { config: { broadcast: { self: false } } })
      .on('broadcast', { event: 'call_ice' }, async ({ payload }) => {
        if (!payload?.c) return;
        try {
          if (pc && pc.remoteDescription) {
            await pc.addIceCandidate(new RTCIceCandidate(payload.c));
          } else {
            pendingIce.push(payload.c);
          }
        } catch (e) {}
      })
      .on('broadcast', { event: 'call_ended' }, () => {
        toast('Call ended');
        endCurrentCall(false);
        showScreen('home-screen');
      });

    await waitForSubscribed(callChannel);

    pc = makePeer();
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    await pc.setRemoteDescription(new RTCSessionDescription(pendingCall.sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    await callChannel.send({
      type: 'broadcast',
      event: 'call_answer',
      payload: {
        sdp: pc.localDescription.toJSON()
      }
    });

    setCallHeader(pendingCall.callerName);
    document.getElementById('ic-timer').textContent = '00:00';
    showScreen('incall-screen');
    load(false);

    pendingCall = null;
  } catch (err) {
    load(false);
    pendingCall = null;
    endCurrentCall(false);
    showScreen('home-screen');
    toast('Unable to accept the call');
  }
}

async function declineCall() {
  stopRing();
  if (pendingCall) {
    await replyBusy(pendingCall.callId);
    pendingCall = null;
  }
  showScreen('home-screen');
}

async function doEndCall() {
  if (callChannel && activeCallId) {
    try {
      await callChannel.send({
        type: 'broadcast',
        event: 'call_ended',
        payload: { callId: activeCallId }
      });
    } catch (e) {}
  }
  await endCurrentCall(true);
  showScreen('home-screen');
}

async function endCurrentCall(sendHangup = false) {
  stopRing();
  clearInterval(timerInt);
  timerInt = null;
  timerSec = 0;
  callStarted = false;

  if (callTimeout) {
    clearTimeout(callTimeout);
    callTimeout = null;
  }

  pendingIce = [];

  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }

  if (pc) {
    try { pc.onicecandidate = null; } catch (e) {}
    try { pc.ontrack = null; } catch (e) {}
    try { pc.onconnectionstatechange = null; } catch (e) {}
    try { pc.close(); } catch (e) {}
    pc = null;
  }

  if (callChannel) {
    try {
      if (sendHangup && activeCallId) {
        await callChannel.send({
          type: 'broadcast',
          event: 'call_ended',
          payload: { callId: activeCallId }
        });
      }
    } catch (e) {}
    await sb.removeChannel(callChannel);
    callChannel = null;
  }

  activeCallId = null;
  pendingCall = null;
  document.getElementById('remote-audio').srcObject = null;
  document.getElementById('btn-mute').classList.remove('on');
  document.getElementById('btn-spk').classList.remove('on');
  document.getElementById('mute-label').textContent = 'Mute';
  muted = false;
  document.getElementById('ic-timer').textContent = '00:00';
}

function toggleMute() {
  muted = !muted;
  if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !muted);
  document.getElementById('btn-mute').classList.toggle('on', muted);
  document.getElementById('mute-label').textContent = muted ? 'Unmute' : 'Mute';
  toast(muted ? 'Muted' : 'Unmuted');
}

function toggleSpeaker() {
  const btn = document.getElementById('btn-spk');
  btn.classList.toggle('on');
  toast(btn.classList.contains('on') ? 'Speakerphone on' : 'Speakerphone off');
}

function startTimer() {
  clearInterval(timerInt);
  timerSec = 0;
  timerInt = setInterval(() => {
    timerSec++;
    const m = String(Math.floor(timerSec / 60)).padStart(2, '0');
    const s = String(timerSec % 60).padStart(2, '0');
    document.getElementById('ic-timer').textContent = `${m}:${s}`;
  }, 1000);
}

function playRing() {
  try {
    stopRing();
    ringCtx = new (window.AudioContext || window.webkitAudioContext)();

    const beep = () => {
      [880, 660].forEach((freq, i) => {
        const osc = ringCtx.createOscillator();
        const gain = ringCtx.createGain();
        osc.connect(gain);
        gain.connect(ringCtx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';

        const t0 = ringCtx.currentTime + i * 0.22;
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.24, t0 + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.35);

        osc.start(t0);
        osc.stop(t0 + 0.35);
        ringNodes.push(osc);
      });
    };

    beep();
    ringLoop = setInterval(beep, 1800);
  } catch (e) {}
}

function stopRing() {
  if (ringLoop) {
    clearInterval(ringLoop);
    ringLoop = null;
  }
  ringNodes.forEach(n => {
    try { n.stop(); } catch (e) {}
  });
  ringNodes = [];
  if (ringCtx) {
    try { ringCtx.close(); } catch (e) {}
    ringCtx = null;
  }
}

async function doLogout() {
  await endCurrentCall(false);
  stopOnlinePulse();
  await setOnlineState(false);
  if (inboxChannel) {
    await sb.removeChannel(inboxChannel);
    inboxChannel = null;
  }
  await sb.auth.signOut();
  me = null;
  myName = '';
  showScreen('auth-screen');
  switchTab('login');
  setErr('');
  document.getElementById('search-results').innerHTML = `
    <div class="empty-state">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <circle cx="22" cy="22" r="14" stroke="white" stroke-width="2"/>
        <path d="M32 32l8 8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <p>Search for a username to start a call</p>
    </div>
  `;
}

async function boot() {
  if (booted) return;
  booted = true;

  load(true, 'Loading…');

  sb.auth.onAuthStateChange(async (_event, session) => {
    if (!session?.user && me) {
      await endCurrentCall(false);
      stopOnlinePulse();
      if (inboxChannel) {
        try { await sb.removeChannel(inboxChannel); } catch (e) {}
        inboxChannel = null;
      }
      me = null;
      myName = '';
      showScreen('auth-screen');
    }
  });

  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    try {
      const username = await loadProfile(session.user);
      await enterApp(session.user, username);
    } catch (e) {
      console.error(e);
      showScreen('auth-screen');
    }
  } else {
    showScreen('auth-screen');
  }

  load(false);
}

window.addEventListener('beforeunload', () => {
  if (me) setOnlineState(false);
});

boot();
</script>
