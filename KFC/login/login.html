<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KFC e-Card Login</title>
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container">

  <div id="loginBox">
    <h2>Member Login</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">LOGIN</button>
    <p id="error" class="error"></p>
  </div>

  <div id="formBox" class="hidden">
    <h2>Create e-Card</h2>
    <input id="name" placeholder="Name">
    <input id="urdu" placeholder="Urdu Name">
    <input id="desg" placeholder="Designation">
    <input id="cno" placeholder="Card Number">
    <input id="bg" placeholder="Blood Group">
    <input id="mobile" placeholder="Mobile">
    <input id="photo" type="file">
    <button onclick="generate()">Generate Card</button>
  </div>

  <div id="ecardSection" class="hidden">
    <h2>Generated e-Card</h2>
    <img id="photoPreview" width="120">
    <p id="eName"></p>
    <p id="eUrdu"></p>
    <p id="eDesg"></p>
    <p id="eNo"></p>
    <p id="eBG"></p>
    <p id="eMobile"></p>
  </div>

</div>

<script src="login.js"></script>
</body>
</html>
