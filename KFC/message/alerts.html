<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alerts - Khawrai Falahi Committee UAE</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

/* Urdu Font */
@font-face{
  font-family:'UrduFont';
  src:url('../NewCard/static/fonts/urdu.ttf') format('truetype');
  font-display:swap;
}

/* Reset */
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Calibri',sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  background: linear-gradient(135deg,#e0eaff,#ffffff);
  color:#1a1a1a;
  padding:20px;
  overflow-x:hidden;
  direction:rtl;
  text-align:right;
}
[lang="ur"]{
  font-family:'UrduFont',serif;
  direction:rtl;
}

/* Hero */
.hero{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  text-align:right;
  min-height:100vh;
  width:100%;
  padding:1.5rem;
}
.hero-overlay{
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(18px) saturate(180%);
  z-index:1;
  border-radius:50px;
}
.hero-content{
  position:relative;
  z-index:2;
  max-width:700px;
  width:100%;
  padding:2rem 1.5rem;
  border-radius:25px;
  background:rgba(255,255,255,0.25);
  box-shadow:0 12px 40px rgba(0,0,0,0.18);
  border:1px solid rgba(255,255,255,0.4);
  overflow:hidden;
}

/* Top-left icons */
.top-icons{
  position:absolute;
  top:15px;
  left:15px;
  display:flex;
  gap:10px;
  z-index:5;
}
.top-icons a{
  display:flex;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(90deg,#ff6ec4,#7873f5);
  color:#fff;
  text-decoration:none;
  box-shadow:0 8px 20px rgba(0,0,0,0.35);
  transition:0.3s;
  font-size:18px;
}
.top-icons a:hover{
  transform:scale(1.1);
}

/* Logo */
.logo-title{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:20px;
}
.logo-title img.logo{
  width:100px;
  margin-bottom:12px;
  animation:logoFade 2.5s ease-in-out infinite;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,0.35));
}
@keyframes logoFade{
  0%{opacity:0.8;transform:scale(1);}
  50%{opacity:1;transform:scale(1.05);}
  100%{opacity:0.8;transform:scale(1);}
}
.logo-title h1 span{
  display:inline-flex;
  align-items:center;
  gap:8px;
  flex-direction:row-reverse; 
  background:linear-gradient(90deg,#ff6ec4,#7873f5);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.logo-title h1 span i{
  font-size:1em;
}

/* ALERT CARD */
.alert-card{
  background:rgba(255,255,255,0.35);
  border-radius:25px;
  padding:15px 20px;
  box-shadow:0 12px 35px rgba(0,0,0,0.25);
  margin-bottom:20px;
  text-align:center;
  transition:0.3s;
  cursor:pointer;
  direction:rtl;
  position:relative;
  overflow:hidden;
}
.alert-card::before{
  content:'';
  position:absolute;
  top:50%;
  left:50%;
  width:200px;
  height:200px;
  background:url('https://livenews.live/KFC/logo.png') center/contain no-repeat;
  opacity:0.06;
  transform:translate(-50%,-50%);
}
.alert-card .card-logo{
  position:absolute;
  top:10px;
  right:30px;
  width:80px;
  height:80px;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,0.35));
}
.alert-card:hover{
  transform:translateY(-4px);
}

/* Date */
.alert-date{
  font-weight:bold;
  font-size:12px;
  margin-bottom:8px;
  color:#0d3c91;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

/* Titles */
.alert-title{
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}
.alert-title[lang="ur"]{
  font-size:18px;
}

/* Body */
.alert-body{
  max-height:0;
  overflow:hidden;
  transition:max-height 0.5s ease;
  font-size:14px;
  color:#333;
  white-space:pre-line;
}
.alert-body[lang="ur"]{
  font-size:18px;
}
.alert-card.active .alert-body{
  max-height:1000px;
}

/* Share icon */
.share-icon{
  position:absolute;
  top:15px;
  left:15px;
  font-size:1rem;
  color:#0d3c91;
  cursor:pointer;
  transition:0.3s;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,0.35));
}
.share-icon:hover{
  color:#ff6ec4;
}

/* Floating shapes */
.floating-shape{
  position:absolute;
  border-radius:50%;
  opacity:0.25;
  animation:floatShapes 8s ease-in-out infinite;
}
.shape1{width:120px;height:120px;background:#ff9a9e;top:10%;left:5%;}
.shape2{width:180px;height:180px;background:#a1c4fd;bottom:15%;right:10%;}
.shape3{width:90px;height:90px;background:#fccb90;top:50%;left:70%;}

@keyframes floatShapes{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(15px);}
}

</style>
</head>

<body>

<section class="hero">
<div class="hero-overlay"></div>

<div class="hero-content">

<div class="top-icons">
  <a href="https://livenews.live/KFC/message/Gallery/gallery.html"><i class="fa-solid fa-images"></i></a>
  <a href="https://livenews.live/KFC/message/cabinet.html"><i class="fa-solid fa-users"></i></a>
  <a href="https://livenews.live/KFC/index.html"><i class="fa-solid fa-house"></i></a>
</div>

<div class="logo-title">
<img src="https://livenews.live/KFC/logo.png" class="logo">
<h1><span><i class="fa-solid fa-bell"></i> Alerts</span></h1>
</div>

<div id="alerts-container"></div>

</div>

<div class="floating-shape shape1"></div>
<div class="floating-shape shape2"></div>
<div class="floating-shape shape3"></div>

</section>

<script>
async function loadAlerts() {
  await document.fonts.ready;

  const res = await fetch('https://livenews.live/KFC/message/alerts.json');
  const data = await res.json();

  data.sort((a,b)=>{
    const [dA,mA,yA] = a.date.split('-').map(Number);
    const [dB,mB,yB] = b.date.split('-').map(Number);
    return new Date(yB,mB-1,dB) - new Date(yA,mA-1,dA);
  });

  const container = document.getElementById('alerts-container');
  container.innerHTML = '';

  data.forEach(item => {
    const card = document.createElement('div');
    card.className = 'alert-card';
    card.innerHTML = `
      <img src="https://livenews.live/KFC/logo.png" class="card-logo">
      <div class="alert-date"><i class="fa-solid fa-calendar-days"></i> ${item.date}</div>
      <div class="alert-title">${item.title_en}</div>
      <div class="alert-title" lang="ur">${item.title_ur}</div>
      <div class="alert-body" lang="ur">${item.body_ur}</div>
      <div class="share-icon"><i class="fa-solid fa-bell"></i></div>
    `;

    card.addEventListener('click', () => card.classList.toggle('active'));

    const shareBtn = card.querySelector('.share-icon');
    shareBtn.addEventListener('click', async e => {
      e.stopPropagation();
      await document.fonts.ready;

      html2canvas(card, {
        scale:4,
        useCORS:true,
        backgroundColor:null
      }).then(canvas => {

        // create premium wrapper
        const finalCanvas = document.createElement('canvas');
        const ctx = finalCanvas.getContext('2d');

        const padding = 40;
        finalCanvas.width = canvas.width + padding * 2;
        finalCanvas.height = canvas.height + padding * 2;

        // white background
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0,0,finalCanvas.width,finalCanvas.height);

        // shadow
        ctx.shadowColor = "rgba(0,0,0,0.25)";
        ctx.shadowBlur = 30;
        ctx.shadowOffsetY = 10;

        ctx.drawImage(canvas, padding, padding);

        finalCanvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `Alert_${item.date}.png`;
          link.click();
          URL.revokeObjectURL(url);
        });
      });
    });

    container.appendChild(card);
  });
}

loadAlerts();
</script>

</body>
</html>
