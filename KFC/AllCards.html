<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khawrai Falahi Committee UAE e-Cards</title>

<style>
@font-face {
  font-family: 'UrduFont';
  src: url('static/fonts/Urdu.ttf') format('truetype');
}

:root {
  --print-card-scale: 0.30;
  --page-gap: 15px;
}

/* Base */
* { box-sizing: border-box; }

body{
  margin:0;
  font-family:Calibri,sans-serif;
  background-color:#e4fffc;
  color:#111;
}

/* Login gate */
.lock-screen {
  position: fixed;
  inset: 0;
  z-index: 5000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #dffbff, #eef9f6);
  padding: 20px;
}

.lock-card {
  width: min(420px, 100%);
  background: rgba(255,255,255,0.9);
  border-radius: 22px;
  box-shadow: 0 18px 45px rgba(0,0,0,0.18);
  padding: 28px 22px;
  text-align: center;
  border: 1px solid rgba(0,0,0,0.06);
}

.lock-card h1 {
  margin: 0 0 8px 0;
  font-size: 24px;
  color: #1f4f7a;
}

.lock-card p {
  margin: 0 0 18px 0;
  color: #4b6477;
  font-size: 14px;
}

.lock-input {
  width: 100%;
  padding: 13px 15px;
  font-size: 16px;
  border: 1px solid #c8d8e6;
  border-radius: 12px;
  outline: none;
  margin-bottom: 12px;
  font-family: inherit;
}

.lock-input:focus {
  border-color: #4a90e2;
  box-shadow: 0 0 0 3px rgba(74,144,226,0.15);
}

.lock-btn {
  width: 100%;
  padding: 13px 15px;
  border: none;
  border-radius: 12px;
  background: #4a90e2;
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
}

.lock-btn:hover { background: #357ab7; }

.lock-error {
  margin-top: 12px;
  color: #b00020;
  font-size: 14px;
  min-height: 20px;
}

/* App area */
.app-shell {
  display: none;
}

/* Main grid */
.card-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--page-gap);
  padding: 15px;
  justify-items: center;
  max-width: 1100px;
  margin: 0 auto;
}

.person-wrapper {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}

/* Scaler container */
.card-scaler {
  width: 305px;
  height: 200px;
  position: relative;
  overflow: visible;
}

.ecard-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 610px;
  height: 400px;
  border-radius: 40px;
  box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
  overflow: hidden;
  transform: scale(0.5);
  transform-origin: top left;
}

/* Original Card CSS */
.bg-img { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:0; }
.watermark-img { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:0.1; z-index:1; }
.logo{ position:absolute; top:10px; right:20px; width:100px; opacity:0.8; z-index:10; }
.logo1{ position:absolute; top:30px; left:28px; width:55px; z-index:10; }
.logo2{ position:absolute; top:30px; left:70px; width:55px; z-index:10; }
.center-logo{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:200px; opacity:0.08; z-index:2; }
.ecard-label{ position:absolute; top:110px; left:50%; transform:translateX(-50%); font-size:24px; font-weight:bold; color:#f36d21; z-index:15; text-align:center; }
.photo{ position:absolute; bottom:25px; right:40px; width:130px; z-index:3; }
.photo-small{ position:absolute; bottom:195px; left:150px; width:40px; opacity:0.2; border-radius:10%; z-index:3; }
.photosticker{ position:absolute; bottom:25px; right:40px; width:130px; height:160px; opacity:0.1; z-index:9; }
.photo-logo{ position:absolute; bottom:40px; right:30px; width:100px; opacity:0.1; pointer-events:none; z-index:8; }
.photo-logo2{ position:absolute; bottom:195px; left:150px; width:40px; height:50px; border-radius:10%; opacity:0.1; z-index:8; }
.photo-logo3{ position:absolute; bottom:-91px; left:-100px; width:810px; opacity:0.6; pointer-events:none; z-index:7; }
.stamp{ position:absolute; bottom:8px; right:140px; width:135px; z-index:11; }
.qr-code{ position:absolute; bottom:230px; left:37px; width:80px; z-index:11; }
.signature{ position:absolute; bottom:8px; left:250px; width:170px; transform:rotate(-15deg); z-index:11; }
.text-container{ position:absolute; bottom:60px; top:180px; left:40px; font-family:"Courier New", monospace; color:#00427a; font-weight:bold; line-height:1.7; z-index:12; }
.text-container p{ margin:2px 0; }
.text-urdu{ font-family:'UrduFont'; font-size:10px; color:#00427a; font-weight:bold; }
.designation{ color:purple; font-weight:bold; }
.header-text{ position:absolute; top:40px; left:50%; transform:translateX(-50%); text-align:center; color:#301934; font-size:14px; font-family:'Times'; z-index:15; white-space:nowrap; }
.header-text-urdu{ position:absolute; top:70px; left:50%; transform:translateX(-50%); text-align:center; font-family:'UrduFont'; color:#301934; font-size:18px; line-height:1; z-index:12; }
.strip-hole{ position:absolute; top:9px; left:50%; transform:translateX(-50%); width:71px; height:10px; background-color:grey; border-radius:5px; z-index:11; }
.strip-hole2{ position:absolute; top:10px; left:50%; transform:translateX(-50%); width:70px; height:9.3px; background-color:white; border-radius:5px; z-index:11; }
.date{ position:absolute; top:150px; right:35px; font-family:"Courier New", monospace; font-size:10px; color:green; font-weight:bold; z-index:12; }
.valid-till{ position:absolute; top:170px; right:36px; font-family:"Courier New", monospace; font-size:9px; color:red; font-weight:bold; z-index:12; }
.issuance{ margin-top:10px; font-family:"Courier New", monospace; font-size:15px; color:#00427a; font-weight:bold; line-height:1; }
.back-overlay-logo{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:220px; opacity:0.08; z-index:2;}
.verify-box{ position:absolute; top:30px; left:50%; transform:translateX(-50%); text-align:center; font-size:12px; font-family:Calibri; z-index:10; }
.verify-box img{ width:70px; margin-top:5px; }
.verify-name{ margin-top:5px; font-weight:bold; }
.verify-photo{ width:60px; opacity:0.15; margin-top:5px; border-radius:6px; }
.verify-qr-wrap{ position:relative; width:70px; height:70px; margin:5px auto 0 auto; }
.verify-qr-wrap img{ width:70px; height:70px; margin-top:0; display:block; }
.center-text{ position:absolute; top:135px; left:50px; right:50px; text-align:center; font-size:10.5px; font-family:Calibri; color:#222; line-height:1.4; z-index:10; }
.urdu-text { font-family:'UrduFont', sans-serif; font-size:11px; direction:rtl; line-height:1.5; margin-top:8px; }
.contacts{ position:absolute; bottom:30px; left:40px; font-size:12px; font-family:Calibri; color:black; line-height:1.6; z-index:10;}

.cancel-banner{
  position:absolute; top:60%; left:0; width:100%; transform:translateY(-50%);
  background:rgba(220,0,0,0.85); color:white; text-align:center; font-size:50px;
  font-weight:bold; padding:50px 0; z-index:999; letter-spacing:2px;
  box-shadow:0 0 10px rgba(0,0,0,0.5); pointer-events:none;
}

/* Floating actions */
.global-actions {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 1000;
  display: flex;
  gap: 10px;
}

.action-btn {
  background-color: #4a90e2;
  color: white;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  padding: 10px 14px;
  font-weight: bold;
  font-size: 18px;
  box-shadow: 0px 0px 5px rgba(0,0,0,0.2);
  transition: 0.3s;
  line-height: 1;
  min-width: 42px;
}
.action-btn:hover { background-color: #357ab7; }

/* QR Mask Overlay */
.qr-mask-emoji{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:32px;
  line-height:1;
  background:rgba(255,255,255,0.85);
  border-radius:10px;
  z-index:2;
  pointer-events:none;
}

/* Pagination */
.pagination-wrap {
  max-width: 1100px;
  margin: 0 auto 20px auto;
  padding: 8px 15px 20px 15px;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
}

.page-btn {
  border: 1px solid #4a90e2;
  background: white;
  color: #1f4f7a;
  border-radius: 8px;
  padding: 8px 12px;
  min-width: 38px;
  cursor: pointer;
  font-family: Calibri, sans-serif;
  font-size: 14px;
  font-weight: 700;
}

.page-btn:hover {
  background: #eaf4ff;
}

.page-btn.active {
  background: #4a90e2;
  color: white;
}

.page-btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.page-ellipsis {
  padding: 8px 4px;
  color: #1f4f7a;
  font-weight: 700;
  font-size: 14px;
}

.page-info {
  width: 100%;
  text-align: center;
  margin-top: 2px;
  color: #1f4f7a;
  font-size: 13px;
  font-weight: 700;
}

/* Print break helper */
.print-page-break {
  display: none;
}

/* Responsive */
@media (max-width: 900px) {
  .card-grid {
    grid-template-columns: 1fr;
  }
}

/* Print */
@media print {
  @page {
    size: auto;
    margin: 6mm;
  }

  html, body {
    background: #fff !important;
    margin: 0 !important;
    padding: 0 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .no-print { display: none !important; }

  .app-shell {
    display: block !important;
  }

  .card-grid {
    display: grid !important;
    grid-template-columns: repeat(2, max-content) !important;
    gap: 4mm !important;
    justify-content: center !important;
    align-content: start !important;
    max-width: none !important;
    padding: 0 !important;
    margin: 0 !important;
  }

  .person-wrapper {
    display: contents !important;
  }

  .card-scaler {
    width: calc(610px * var(--print-card-scale)) !important;
    height: calc(400px * var(--print-card-scale)) !important;
    position: relative !important;
    overflow: visible !important;
    break-inside: avoid !important;
    page-break-inside: avoid !important;
  }

  .ecard-container {
    transform: scale(var(--print-card-scale)) !important;
    transform-origin: top left !important;
  }

  .print-page-break {
    display: block !important;
    break-after: page !important;
    page-break-after: always !important;
    grid-column: 1 / -1 !important;
    height: 0 !important;
    overflow: hidden !important;
  }

  .global-actions,
  .pagination-wrap {
    display: none !important;
  }
}
</style>
</head>
<body>

<!-- Password gate -->
<div id="lockScreen" class="lock-screen">
  <div class="lock-card">
    <h1>Enter Password</h1>
    <p>This page will load only after the correct password is entered.</p>
    <form id="unlockForm">
      <input id="passwordInput" class="lock-input" type="password" placeholder="Password" autocomplete="off" inputmode="numeric" />
      <button type="submit" class="lock-btn">Unlock</button>
    </form>
    <div id="lockError" class="lock-error"></div>
  </div>
</div>

<!-- App -->
<div id="appShell" class="app-shell">
  <div class="global-actions no-print">
    <button id="globalMaskBtn" class="action-btn" aria-label="Mask all cards" title="Mask all cards">👁</button>
  </div>

  <div id="pdfArea" class="card-grid"></div>
  <div id="pagination" class="pagination-wrap no-print"></div>
  <div id="qrTemp" style="position:absolute; left:-9999px; top:0; width:200px; height:200px;"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
const lockScreen = document.getElementById("lockScreen");
const appShell = document.getElementById("appShell");
const unlockForm = document.getElementById("unlockForm");
const passwordInput = document.getElementById("passwordInput");
const lockError = document.getElementById("lockError");

const pdfArea = document.getElementById("pdfArea");
const paginationEl = document.getElementById("pagination");
const qrTemp = document.getElementById("qrTemp");
const globalMaskBtn = document.getElementById("globalMaskBtn");

const PASSWORD_B64 = "MzU2NDI1MDIzNjYzMzM4";

let allCards = [];
let renderedCards = [];
let urduCache = new Map();
let globalIsMasked = false;
let currentPage = 1;
const cardsPerPage = 10; // 4 members per page = 8 card faces per page
let renderToken = 0;
let appStarted = false;

function encodeCard(raw) {
  return btoa(raw);
}

function maskName(name) {
  if (!name) return "";
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if (parts.length <= 1) return "***";
  if (parts.length === 2) return "*** ***";
  return ["***", ...parts.slice(1, -1), "***"].join(" ");
}

function maskCardNumber(cardNoValue) {
  if (!cardNoValue) return "";
  return cardNoValue.replace(/(\d{3})(?!.*\d)/, "***");
}

function maskMobile(mobileValue) {
  if (!mobileValue) return "";
  return mobileValue.replace(/(\d{4})(?!.*\d)/, "****");
}

async function translateToUrdu(text) {
  if (!text) return "";
  if (urduCache.has(text)) return urduCache.get(text);

  try {
    const res = await fetch(
      `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ur&dt=t&q=${encodeURIComponent(text)}`
    );
    const data = await res.json();
    const translated = data?.[0]?.[0]?.[0] || text;
    urduCache.set(text, translated);
    return translated;
  } catch (err) {
    urduCache.set(text, text);
    return text;
  }
}

function loadQrIntoImage(url, imgEl) {
  return new Promise((resolve) => {
    qrTemp.innerHTML = "";
    new QRCode(qrTemp, {
      text: url,
      width: 200,
      height: 200,
      colorDark: "#000000",
      colorLight: "#0000",
      correctLevel: QRCode.CorrectLevel.H
    });

    setTimeout(() => {
      const qrCanvas = qrTemp.querySelector("canvas");
      if (qrCanvas) {
        imgEl.src = qrCanvas.toDataURL("image/png");
        resolve();
        return;
      }

      const qrImg = qrTemp.querySelector("img");
      if (qrImg) {
        imgEl.src = qrImg.src;
      }
      resolve();
    }, 0);
  });
}

function getVisiblePages(totalPages, page) {
  const pages = [];
  const add = (p) => {
    if (!pages.includes(p) && p >= 1 && p <= totalPages) pages.push(p);
  };

  add(1);
  for (let p = page - 2; p <= page + 2; p++) add(p);
  add(totalPages);

  return pages.sort((a, b) => a - b);
}

function renderPagination(totalPages) {
  paginationEl.innerHTML = "";

  if (totalPages <= 1) {
    return;
  }

  const wrapper = document.createElement("div");
  wrapper.style.display = "flex";
  wrapper.style.flexWrap = "wrap";
  wrapper.style.justifyContent = "center";
  wrapper.style.gap = "8px";
  wrapper.style.width = "100%";

  const prevBtn = document.createElement("button");
  prevBtn.className = "page-btn";
  prevBtn.type = "button";
  prevBtn.textContent = "‹";
  prevBtn.disabled = currentPage === 1;
  prevBtn.addEventListener("click", () => setPage(currentPage - 1));
  wrapper.appendChild(prevBtn);

  const visiblePages = getVisiblePages(totalPages, currentPage);
  let lastShown = 0;

  for (const p of visiblePages) {
    if (p - lastShown > 1) {
      const ell = document.createElement("span");
      ell.className = "page-ellipsis";
      ell.textContent = "...";
      wrapper.appendChild(ell);
    }

    const btn = document.createElement("button");
    btn.className = "page-btn" + (p === currentPage ? " active" : "");
    btn.type = "button";
    btn.textContent = String(p);
    btn.addEventListener("click", () => setPage(p));
    wrapper.appendChild(btn);

    lastShown = p;
  }

  const nextBtn = document.createElement("button");
  nextBtn.className = "page-btn";
  nextBtn.type = "button";
  nextBtn.textContent = "›";
  nextBtn.disabled = currentPage === totalPages;
  nextBtn.addEventListener("click", () => setPage(currentPage + 1));
  wrapper.appendChild(nextBtn);

  const info = document.createElement("div");
  info.className = "page-info";
  info.textContent = `Page ${currentPage} of ${totalPages} — ${allCards.length} members total`;

  paginationEl.appendChild(wrapper);
  paginationEl.appendChild(info);
}

function setPage(page) {
  const totalPages = Math.max(1, Math.ceil(allCards.length / cardsPerPage));
  currentPage = Math.min(Math.max(page, 1), totalPages);
  history.replaceState(null, "", `#page=${currentPage}`);
  renderPage(currentPage);
}

function getPageFromHash() {
  const hash = location.hash || "";
  const match = hash.match(/page=(\d+)/i);
  if (match) return Math.max(1, parseInt(match[1], 10) || 1);
  return 1;
}

function updatePrintScale() {
  const isPortrait = window.matchMedia("(orientation: portrait)").matches;

  // Conservative scales so 4 members (8 card faces) fit without clipping
  const portraitScale = 0.26;
  const landscapeScale = 0.32;

  const scale = isPortrait ? portraitScale : landscapeScale;
  document.documentElement.style.setProperty("--print-card-scale", scale.toFixed(4));
}

function applyMaskStateToRenderedCards() {
  renderedCards.forEach(item => {
    if (globalIsMasked) {
      item.nameEl.textContent = "Name: " + maskName(item.data.name);
      item.urduEl.textContent = maskName(item.urduName);
      item.noEl.textContent = "Card No.: " + maskCardNumber(item.data.CNo);
      item.contactEl.textContent = "Contact: " + maskMobile(item.data.mobile);
      item.verifyNameEl.textContent = maskName(item.data.name);
      item.qrMaskEl.style.display = "flex";
    } else {
      item.nameEl.textContent = "Name: " + item.data.name;
      item.urduEl.textContent = item.urduName;
      item.noEl.textContent = "Card No.: " + item.data.CNo;
      item.contactEl.textContent = "Contact: " + item.data.mobile;
      item.verifyNameEl.textContent = item.data.name;
      item.qrMaskEl.style.display = "none";
    }
  });
}

async function renderPage(pageNumber) {
  const token = ++renderToken;
  pdfArea.innerHTML = "";
  renderedCards = [];

  const startIndex = (pageNumber - 1) * cardsPerPage;
  const pageCards = allCards.slice(startIndex, startIndex + cardsPerPage);
  const totalPages = Math.max(1, Math.ceil(allCards.length / cardsPerPage));

  renderPagination(totalPages);

  for (const card of pageCards) {
    if (token !== renderToken) return;

    const personDiv = document.createElement("div");
    personDiv.className = "person-wrapper";

    const desg = (card.Desg || "").toLowerCase();
    let bgSrc = "static/images/background.png";
    let labelTxt = "e-Card";

    if (desg.includes("acting president")) {
      bgSrc = "static/images/background2.png";
      labelTxt = "Acting President's e-Card";
    } else if (desg.includes("vice president")) {
      bgSrc = "static/images/background2.png";
      labelTxt = "Vice President's e-Card";
    } else if (desg.includes("president")) {
      bgSrc = "static/images/background2.png";
      labelTxt = "President's e-Card";
    }

    let urduName = card.urduName;
    if (!urduName || urduName.trim() === "") {
      urduName = await translateToUrdu(card.name);
    }

    const defaultStamp = "static/images/stamp.png";
    const defaultSign = "static/images/signature.png";
    let stampSrc = defaultStamp;
    let signSrc = defaultSign;

    if (card.Authority && card.Authority.trim() !== "") {
      const authFolder = card.Authority.toLowerCase();
      stampSrc = `static/images/photos/${authFolder}/stamp.png`;
      signSrc = `static/images/photos/${authFolder}/signature.png`;
    }

    const cardPhoto = `static/images/photos/${card.CNo}.png`;
    const fallbackPhoto = "static/images/photos/photo.png";

    personDiv.innerHTML = `
      <div class="card-scaler">
        <div class="ecard-container">
          <img src="${bgSrc}" class="bg-img">
          <img src="static/images/watermark.png" class="watermark-img">
          <div class="strip-hole"></div><div class="strip-hole2"></div>
          <img src="static/images/logo1.png" class="logo1">
          <img src="static/images/logo2.png" class="logo2">
          <img src="static/images/logo.png" class="logo">
          <img src="static/images/logo.png" class="center-logo">
          <img src="${stampSrc}" class="stamp" onerror="this.src='${defaultStamp}'">
          <img src="${cardPhoto}" class="photo" onerror="this.src='${fallbackPhoto}'">
          <img src="${cardPhoto}" class="photo-small" onerror="this.src='${fallbackPhoto}'">
          <img src="static/images/sticker.png" class="photosticker">
          <img src="static/images/logo.png" class="photo-logo">
          <img src="static/images/sticker.png" class="photo-logo2">
          <img src="static/images/shadow.png" class="photo-logo3">
          <div class="ecard-label">${labelTxt}</div>
          <img src="static/images/qrcode.png" class="qr-code">
          <img src="${signSrc}" class="signature" onerror="this.src='${defaultSign}'">
          <div class="text-container">
            <p class="card-name">Name: ${card.name}</p>
            <p><span>Urdu Name: </span><span class="card-urdu text-urdu">${urduName}</span></p>
            <p class="designation">Desg: ${card.Desg}</p>
            <p class="card-no">Card No.: ${card.CNo}</p>
            <p>B-Group: ${card.BG}</p>
            <p class="card-contact">Contact: ${card.mobile}</p>
            <p class="issuance">Issuance Authority: ___________________</p>
          </div>
          <div class="header-text">KHAWRAI FALAHI COMMITTEE UAE</div>
          <div class="header-text-urdu">خاورئی فلاحی کمیٹی متحدہ عرب امارات</div>
          <div class="date">ISSUE DATE: ${card.Issue}</div>
          <div class="valid-till">VALIDITY: ${(card.Validity || "UAE VISA EXPIRY").toUpperCase()}</div>
          ${card.Status && card.Status.toLowerCase() === "cancel" ? '<div class="cancel-banner">e-Card CANCELLED</div>' : ''}
        </div>
      </div>

      <div class="card-scaler">
        <div class="ecard-container">
          <img src="${bgSrc}" class="bg-img">
          <img src="static/images/watermark.png" class="watermark-img">
          <img src="static/images/logo.png" class="back-overlay-logo">
          <div class="verify-box">
            <div>Verification QR</div>
            <div class="verify-qr-wrap">
              <img class="verify-qr-img">
              <div class="qr-mask-emoji">✘</div>
            </div>
            <div class="verify-name">${card.name}</div>
            <img src="${cardPhoto}" class="verify-photo" onerror="this.src='${fallbackPhoto}'">
          </div>
          <div class="center-text">
            <p>The Khawrai Falahi Committee UAE was established in December 2016. The purpose of the committee is to address the issues faced by residents of Khawrai in the United Arab Emirates and its surroundings, and to resolve them in a timely and professional manner. The leadership of the committee is committed to serving the residents of Khawrai in the United Arab Emirates and is determined to address and resolve their various issues promptly.</p>
            <p class="urdu-text">متحدہ عرب امارات میں خاورئی فلاحی کمیٹی دسمبر 2016 میں قائم کی گئی تھی۔ کمیٹی کا مقصد متحدہ عرب امارات میں خاورئی اور اس کے گردونواح کے رہائشیوں کو درپیش مسائل کو حل کرنا اور انہیں بروقت اور پیشہ ورانہ انداز میں حل کرنا ہے۔ کمیٹی کی قیادت متحدہ عرب امارات میں خاورئی کے رہائشیوں کی خدمت کے لیے پرعزم ہے اور ان کے مختلف مسائل کو فوری طور پر حل کرنے کے لیے پُرعزم ہے۔</p>
          </div>
          <div class="contacts">
            Arbab Rizwan (President): +971 55 735 3212<br>
            Salar Khan (Vice President): +971 58 884 0090<br>
            Ahmad Aman (Acting President): +971 56 803 9690
          </div>
        </div>
      </div>
    `;

    pdfArea.appendChild(personDiv);

    renderedCards.push({
      data: card,
      urduName: urduName,
      nameEl: personDiv.querySelector(".card-name"),
      urduEl: personDiv.querySelector(".card-urdu"),
      noEl: personDiv.querySelector(".card-no"),
      contactEl: personDiv.querySelector(".card-contact"),
      verifyNameEl: personDiv.querySelector(".verify-name"),
      qrMaskEl: personDiv.querySelector(".qr-mask-emoji")
    });

    const encoded = encodeCard(card.CNo);
    const url = "https://livenews.live/KFC/viewcard.html?card=" + encoded;
    const qrImgEl = personDiv.querySelector(".verify-qr-img");
    await loadQrIntoImage(url, qrImgEl);
  }

  applyMaskStateToRenderedCards();
}

globalMaskBtn.addEventListener("click", function() {
  globalIsMasked = !globalIsMasked;
  this.textContent = "👁";
  this.title = globalIsMasked ? "Unmask all cards" : "Mask all cards";
  this.setAttribute("aria-label", this.title);
  applyMaskStateToRenderedCards();
});

window.addEventListener("hashchange", () => {
  if (!appStarted) return;
  const page = getPageFromHash();
  setPage(page);
});

window.addEventListener("beforeprint", () => {
  updatePrintScale();
});

window.addEventListener("orientationchange", () => {
  updatePrintScale();
});

function startApp() {
  if (appStarted) return;
  appStarted = true;

  appShell.style.display = "block";
  updatePrintScale();

  fetch("https://livenews.live/KFC/card2.json")
    .then(res => res.json())
    .then(async data => {
      allCards = (Array.isArray(data) ? data : []).filter(card => card && card.CNo);
      const totalPages = Math.max(1, Math.ceil(allCards.length / cardsPerPage));
      const initialPage = Math.min(getPageFromHash(), totalPages);
      currentPage = initialPage;
      await renderPage(currentPage);
      history.replaceState(null, "", `#page=${currentPage}`);
    })
    .catch(err => {
      console.error(err);
      pdfArea.innerHTML = `<div style="padding:20px;color:#b00020;font-weight:bold;">Failed to load card data.</div>`;
    });
}

unlockForm.addEventListener("submit", function(e) {
  e.preventDefault();
  const value = passwordInput.value.trim();
  const enteredB64 = btoa(value);

  if (enteredB64 === PASSWORD_B64) {
    lockError.textContent = "";
    lockScreen.style.display = "none";
    startApp();
  } else {
    lockError.textContent = "Incorrect password.";
    passwordInput.value = "";
    passwordInput.focus();
  }
});

passwordInput.focus();
</script>

</body>
</html>
