<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- TITLE -->
<title>LiveNews</title>

<!-- CSS -->
<link rel="stylesheet" href="style.css">

<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- ===================== -->
<!-- TOP BREAKING BAR -->
<!-- ===================== -->
<div class="breaking-bar">
  <div class="breaking-label">BREAKING</div>
  <div class="breaking-ticker" id="breakingTicker"></div>
</div>

<!-- ===================== -->
<!-- HEADER -->
<!-- ===================== -->
<header class="header glass">

  <!-- LEFT (LOGO) -->
  <div class="header-left">
    <img src="logo.png" class="logo" alt="LiveNews Logo">
  </div>

  <!-- CENTER (SEARCH) -->
  <div class="header-center">
    <input type="text" id="searchInput" placeholder="Search global news...">
  </div>

  <!-- RIGHT (LIVE + PROJECTS MENU) -->
  <div class="header-right">

    <!-- LIVE INDICATOR -->
    <div class="live-indicator">
      <span></span>LIVE
    </div>

    <!-- PROJECTS MENU -->
    <div class="projects-menu-wrapper">

      <!-- ICON BUTTON -->
      <div class="projects-icon" id="projectsToggle">☰</div>

      <!-- DROPDOWN -->
      <div class="projects-dropdown glass" id="projectsDropdown">

        <div class="projects-header">Other Projects</div>

        <!-- PROJECT 1 -->
        <a href="https://livenews.live/KFC" class="project-item">
          <img src="https://livenews.live/KFC/logo.png" alt="KFC Logo">
          <span>Khawrai Falahi Committee</span>
        </a>

        <!-- PROJECT 2 -->
        <a href="https://livenews.live/NSFClix" class="project-item">
          <img src="https://livenews.live/NSFClix/logo.png" class="nsf-logo" alt="NSF Clix Logo">
          <span>NSF Clix</span>
        </a>

      </div>
    </div>

  </div>
</header>

<!-- ===================== -->
<!-- NAVBAR -->
<!-- ===================== -->
<nav class="navbar glass">
  <ul>
    <li data-category="war">US-IRAN Conflict</li>
    <li class="active" data-category="all">All</li>
    <li data-category="world">World</li>
    <li data-category="politics">Politics</li>
    <li data-category="business">Business</li>
    <li data-category="technology">Technology</li>
    <li data-category="economy">Economy</li>
    <li data-category="energy">Energy</li>
  </ul>
</nav>

<!-- ===================== -->
<!-- MAIN CONTENT -->
<!-- ===================== -->
<main class="main-container">

  <!-- NEWS GRID -->
  <section class="news-grid" id="newsGrid"></section>

  <!-- EXPANDED NEWS VIEW -->
  <section class="news-expanded" id="newsExpanded">

    <div class="expanded-container glass">

      <!-- HEADER -->
      <div class="expanded-header">
        <h1 id="expandedTitle"></h1>
        <div class="expanded-meta">
          <span id="expandedDate"></span>
          <span id="expandedCategory"></span>
        </div>
      </div>

      <!-- IMAGE -->
      <div class="expanded-image">
        <img id="expandedImage" src="" alt="News Image">
      </div>

      <!-- CONTENT -->
      <div class="expanded-content" id="expandedContent"></div>

      <!-- ACTION -->
      <div class="expanded-actions">
        <button class="close-btn" id="closeExpanded">Close</button>
      </div>

    </div>

  </section>

  <!-- ===================== -->
  <!-- LOADER (INFINITE SCROLL) -->
  <!-- ===================== -->
  <div id="loader" style="text-align:center; padding:20px; display:none;">
    Loading more news...
  </div>

</main>

<!-- ===================== -->
<!-- FOOTER -->
<!-- ===================== -->
<footer class="footer glass">
  <div class="footer-content">
    <p>© 2026 LiveNews. Global News Network. All rights reserved.</p>
  </div>
</footer>

<!-- ===================== -->
<!-- SCRIPT -->
<!-- ===================== -->
<script src="script.js"></script>

</body>
</html>
