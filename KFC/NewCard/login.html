<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khawrai Falahi Committee e-Card Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* Reset & Body */
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Calibri',sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  background: linear-gradient(135deg, #e0eaff, #ffffff);
  padding:20px;
}

/* Glass Panel Login Box */
.login-box{
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(18px) saturate(180%);
  -webkit-backdrop-filter: blur(18px) saturate(180%);
  border-radius: 25px;
  padding:40px 30px;
  width:400px;
  max-width:90%;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  border-left: 2px solid rgba(255,255,255,0.4);
  border-top: 2px solid rgba(255,255,255,0.4);
  text-align:center;
  position:relative;
  overflow:hidden;
  margin-bottom:15px;
}
.login-box::before{
  content:"";
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
  pointer-events:none;
  border-radius:25px;
}

/* Logo + Title */
.logo-title{
  display:flex;
  flex-direction: column;
  align-items:center;
  justify-content:center;
  animation: fadeInDown 1s ease forwards;
  margin-bottom:20px;
}
.logo-title img.logo{
  width:60px;
  margin-bottom:10px;
  animation: logoFade 2.5s ease-in-out infinite;
}
.logo-title h2{
  font-size:24px;
  color:#0d3c91;
  font-weight:bold;
  text-align:center;
}
.logo-title p.uae-text{
  font-size:18px;
  color:#0d3c91;
  margin-top:5px;
  text-align:center;
}

/* Animations */
@keyframes logoFade{
  0%   {opacity:0.8; transform: scale(1);}
  50%  {opacity:1; transform: scale(1.05);}
  100% {opacity:0.8; transform: scale(1);}
}
@keyframes fadeInDown{
  0%{opacity:0; transform:translateY(-20px);}
  100%{opacity:1; transform:translateY(0);}
}

/* Form Inputs */
.login-box form{display:flex;flex-direction:column;}
.login-box input{
  margin:10px 0;
  padding:12px 15px;
  font-size:16px;
  border-radius:50px;
  border:1px solid rgba(0,0,0,0.1);
  outline:none;
  transition:0.3s;
}
.login-box input:focus{
  border-color:#1976d2;
  box-shadow:0 0 10px rgba(25,118,210,0.3);
}

/* Buttons */
.login-box button{
  padding:12px;
  font-size:16px;
  border:none;
  border-radius:50px;
  background:#1976d2;
  color:white;
  cursor:pointer;
  margin-top:10px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  transition:0.3s;
}
.login-box button:hover{
  background:#125fa6;
  transform:translateY(-2px);
}

/* Error Message */
.error-msg{
  color:red;
  font-size:14px;
  margin-bottom:10px;
}

/* Contact Banner */
.contact-banner{
  display:flex;
  justify-content:center;
  gap:15px;
  padding:10px 15px;
  margin-top:10px;
  font-size:14px;
  flex-wrap:wrap;
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(18px) saturate(180%);
  -webkit-backdrop-filter: blur(18px) saturate(180%);
  border-radius: 25px;
  border: 1px solid rgba(255,255,255,0.3);
  border-left: 2px solid rgba(255,255,255,0.4);
  border-top: 2px solid rgba(255,255,255,0.4);
  position:relative;
  overflow:hidden;
}
.contact-banner::before{
  content:"";
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
  pointer-events:none;
  border-radius:25px;
}
.contact-banner a{
  text-decoration:none;
  color:#0d3c91;
  display:flex;
  align-items:center;
  gap:5px;
  transition:0.3s;
  font-weight:bold;
}
.contact-banner a span{
  font-size:12px;
  color:#125fa6;
}
.contact-banner a:hover{
  transform:translateY(-2px);
}

/* Footer */
footer{
  margin-top:10px;
  font-size:14px;
  text-align:center;
}

/* Mobile Responsiveness */
@media (max-width:600px){
  .login-box{width:90%;padding:25px;}
  .logo-title h2{font-size:20px;}
  .logo-title p.uae-text{font-size:16px;}
  .login-box input{font-size:14px;padding:10px;}
  .login-box button{font-size:14px;padding:10px;}
  .contact-banner{font-size:12px;padding:8px;}
}
</style>
</head>
<body>

<!-- Logo + Title -->
<div class="logo-title">
  <img src="static/images/logo.png" alt="Logo" class="logo">
  <h2>Khawrai Falahi Committee UAE</h2>
  <p class="uae-text">خاورئی فلاحی کمیٹی متحدہ عرب امارات</p>
</div>

<!-- Login Form -->
<div class="login-box">
  <div class="error-msg" id="errorMsg"></div>
  <form id="loginForm">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit"><i class="fas fa-right-to-bracket"></i> Login</button>
  </form>
</div>

<!-- Contact Banner -->
<div class="contact-banner">
  <a href="https://wa.me/971557353212" target="_blank"><i class="fab fa-whatsapp"></i> Arbab M. Rizwan <span>President</span></a>
  <a href="https://wa.me/971588840090" target="_blank"><i class="fab fa-whatsapp"></i> Salar Khan <span>Vice President</span></a>
  <a href="https://wa.me/971568039690" target="_blank"><i class="fab fa-whatsapp"></i> Ahmad A. Khattak <span>Acting President</span></a>
  <a href="https://wa.me/971529297289" target="_blank"><i class="fab fa-whatsapp"></i> Naveed A. Liaqat <span>Finance Manager</span></a>
</div>

<!-- Footer -->
<footer>
  Powered by <a href="https://www.facebook.com/nadeemshahzadfida" target="_blank">Nadeem Shahzad Fida</a>
</footer>

<script>
// User credentials
const USERS = {
  "bnNm aWRh": "NzQ2MjEw",
  "YWhtYWRhbWFu": "NDU2NDU2",
  "c2FiaXJhbGk=": "MzU2NDI1",
  "YXJiYWJyaXp3YW4=": "MDIzNjYz",
  "bmF2ZWVkYWxp": "MTAxMDgx",
  "YW1qYWRhbGk=": "YW1qYWRhbDEyMw==",
  "c2FsYXJraGFu": "c2FsYXI0NTY="
};

// Decode Base64
function decodeBase64(str){ return atob(str.replace(/\s/g,'')); }

document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  const uInput = document.getElementById("username").value.trim();
  const pInput = document.getElementById("password").value.trim();

  let authenticated = false;
  for(const encodedUser in USERS){
    if(decodeBase64(encodedUser) === uInput && decodeBase64(USERS[encodedUser]) === pInput){
      authenticated = true;
      localStorage.setItem("loggedInUser", uInput);
      window.location.href = "index.html";
      break;
    }
  }
  if(!authenticated){
    document.getElementById("errorMsg").textContent = "Invalid username or password";
  }
});

// Redirect if already logged in
if(localStorage.getItem("loggedInUser")) window.location.href = "index.html";
</script>
</body>
</html>
