<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alerts - Khawrai Falahi Committee UAE</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* Urdu Font */
@font-face{
  font-family:'UrduFont';
  src:url('../NewCard/static/fonts/urdu.ttf') format('truetype');
  font-display:swap;
}

/* Reset */
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Calibri',sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  background: linear-gradient(135deg,#e0eaff,#ffffff);
  color:#1a1a1a;
  padding:20px;
  overflow-x:hidden;
  direction:rtl;
  text-align:right;
}

/* Urdu style */
[lang="ur"]{
  font-family:'UrduFont',serif;
  direction:rtl;
}

/* Hero */
.hero{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  text-align:center;
  min-height:100vh;
  width:100%;
  padding:1.5rem;
}
.hero-overlay{
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(18px) saturate(180%);
  z-index:1;
  border-radius:50px;
}
.hero-content{
  position:relative;
  z-index:2;
  max-width:700px;
  width:100%;
  padding:2rem 1.5rem;
  border-radius:25px;
  background:rgba(255,255,255,0.25);
  box-shadow:0 12px 40px rgba(0,0,0,0.18);
  border:1px solid rgba(255,255,255,0.4);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* Top-left icons */
.top-icons{
  position:absolute;
  top:15px;
  left:15px;
  display:flex;
  gap:10px;
  z-index:5;
}
.top-icons a{
  display:flex;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(90deg,#ff6ec4,#7873f5);
  color:#fff;
  text-decoration:none;
  box-shadow:0 8px 20px rgba(0,0,0,0.35);
  transition:0.3s;
  font-size:18px;
}
.top-icons a:hover{
  transform:scale(1.1);
}

/* Top-right user icon */
.user-icon{
  position:absolute;
  top:15px;
  right:15px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(90deg,#ff6ec4,#7873f5);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  cursor:pointer;
  z-index:5;
  font-size:18px;
  box-shadow:0 8px 20px rgba(0,0,0,0.35);
  transition:0.3s;
}
.user-icon:hover{
  transform:scale(1.1);
}

/* User info panel */
.user-panel{
  position:absolute;
  top:70px;
  right:15px;
  width:250px;
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(18px);
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.4);
  padding:15px;
  box-shadow:0 12px 35px rgba(0,0,0,0.25);
  display:none;
  z-index:10;
}
.user-panel h3{
  margin-bottom:10px;
  font-size:16px;
  text-align:center;
}
.user-panel p{
  font-size:14px;
  margin-bottom:6px;
}
.user-panel button{
  width:100%;
  padding:8px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#ff6ec4,#7873f5);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

/* Logo */
.logo-title{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:20px;
}
.logo-title img.logo{
  width:100px;
  margin-bottom:12px;
  animation:logoFade 2.5s ease-in-out infinite;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,0.35));
}
@keyframes logoFade{
  0%{opacity:0.8;transform:scale(1);}
  50%{opacity:1;transform:scale(1.05);}
  100%{opacity:0.8;transform:scale(1);}
}
.logo-title h1 span{
  display:inline-flex;
  align-items:center;
  gap:8px;
  flex-direction:row-reverse; 
  background:linear-gradient(90deg,#ff6ec4,#7873f5);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.logo-title h1 span i{
  font-size:1em;
}

/* ALERT CARD */
.alert-card{
  background:rgba(255,255,255,0.35);
  border-radius:25px;
  padding:15px 20px;
  box-shadow:0 12px 35px rgba(0,0,0,0.25);
  margin-bottom:20px;
  text-align:center;
  transition:0.3s;
  cursor:pointer;
  direction:rtl;
  position:relative;
  overflow:hidden;
}
.alert-card::before{
  content:'';
  position:absolute;
  top:50%;
  left:50%;
  width:200px;
  height:200px;
  background:url('https://livenews.live/KFC/logo.png') center/contain no-repeat;
  opacity:0.06;
  transform:translate(-50%,-50%);
}
.alert-card .card-logo{
  position:absolute;
  top:10px;
  right:30px;
  width:80px;
  height:80px;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,0.35));
}
.alert-card:hover{
  transform:translateY(-4px);
}

/* Date */
.alert-date{
  font-weight:bold;
  font-size:12px;
  margin-bottom:8px;
  color:#0d3c91;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

/* Titles */
.alert-title{
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}
.alert-title[lang="ur"]{
  font-size:18px;
}

/* Body */
.alert-body{
  max-height:0;
  overflow:hidden;
  transition:max-height 0.5s ease;
  font-size:14px;
  color:#333;
  white-space:pre-line;
}
.alert-body[lang="ur"]{
  font-size:18px;
}
.alert-card.active .alert-body{
  max-height:1000px;
}

/* Share icon */
.share-icon{
  position:absolute;
  top:15px;
  left:15px;
  font-size:1rem;
  color:#0d3c91;
  cursor:pointer;
  transition:0.3s;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,0.35));
}
.share-icon:hover{
  color:#ff6ec4;
}

/* Floating shapes */
.floating-shape{
  position:absolute;
  border-radius:50%;
  opacity:0.25;
  animation:floatShapes 8s ease-in-out infinite;
}
.shape1{width:120px;height:120px;background:#ff9a9e;top:10%;left:5%;}
.shape2{width:180px;height:180px;background:#a1c4fd;bottom:15%;right:10%;}
.shape3{width:90px;height:90px;background:#fccb90;top:50%;left:70%;}

@keyframes floatShapes{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(15px);}
}

/* LOGIN OVERLAY */
.login-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:2000;
}
.login-box{
  width:90%;
  max-width:360px;
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(18px);
  border-radius:25px;
  border:1px solid rgba(255,255,255,0.3);
  padding:25px;
  text-align:center;
}
.login-box input {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: none;
  direction: ltr;         /* <-- ensures typing is left-to-right */
  text-align: left;       /* <-- text inside input starts from left */
}
.login-box button{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  background:linear-gradient(90deg,#ff6ec4,#7873f5);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
.login-error{
  color:red;
  font-size:12px;
  margin-bottom:8px;
}
</style>
</head>

<body>

<section class="hero">
<div class="hero-overlay"></div>

<div class="hero-content">

<!-- Left Icons -->
<div class="top-icons">
  <a href="https://livenews.live/KFC/message/Gallery/gallery.html"><i class="fa-solid fa-images"></i></a>
  <a href="https://livenews.live/KFC/message/cabinet.html"><i class="fa-solid fa-users"></i></a>
  <a href="https://livenews.live/KFC/index.html"><i class="fa-solid fa-house"></i></a>
</div>

<!-- User Icon Right -->
<div id="userIcon" class="user-icon"><i class="fa-solid fa-user"></i></div>
<div id="userPanel" class="user-panel"></div>

<!-- Logo & Title -->
<div class="logo-title">
<img src="https://livenews.live/KFC/logo.png" class="logo">
<h1><span><i class="fa-solid fa-bell"></i> Alerts</span></h1>
</div>

<div id="alerts-container"></div>

</div>

<div class="floating-shape shape1"></div>
<div class="floating-shape shape2"></div>
<div class="floating-shape shape3"></div>
</section>

<!-- LOGIN OVERLAY -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-box">
    <h2>Login</h2>
    <input type="text" id="loginUsername" placeholder="Username">
    <input type="password" id="loginPassword" placeholder="Password">
    <div id="loginError" class="login-error"></div>
    <button id="loginBtn">Login</button>
  </div>
</div>

<script>
/* ================= USERS & SESSION ================= */
let users = [];
let currentUser = null;

async function loadUsers(){
  try{
    const res = await fetch("https://livenews.live/KFC/cards.json");
    users = await res.json();
  }catch(e){
    console.error("Error loading users:", e);
  }
}

function generateUsername(name){
  let parts = name.toLowerCase().split(" ");
  if(parts.length < 2) return name.toLowerCase();
  return (parts[0]+parts[parts.length-1]).replace(/\s/g,'');
}

function generatePassword(card){
  if(!card) return "";
  let parts = card.split("-");
  return parts[parts.length-1];
}

function checkSession(){
  const saved = localStorage.getItem("kfcUser");
  if(saved) currentUser = JSON.parse(saved);
}

/* ================= LOGIN FUNCTION ================= */
function login(){
  const uname = document.getElementById("loginUsername").value.trim().toLowerCase();
  const pass = document.getElementById("loginPassword").value.trim();
  const loginError = document.getElementById("loginError");

  if(!uname || !pass){
    loginError.innerText = "Enter username & password";
    return;
  }

  const user = users.find(u=>{
    return generateUsername(u.name)===uname && generatePassword(u.CNo)===pass;
  });

  if(!user){
    loginError.innerText = "Invalid credentials";
    return;
  }

  if(user.Status.toLowerCase()==="cancelled"){
    loginError.innerText = "This card is cancelled";
    return;
  }

  currentUser = user;
  localStorage.setItem("kfcUser", JSON.stringify(user));
  document.getElementById("loginOverlay").style.display="none";

  loadAlerts(); // load alerts after login
  updateUserPanel();
}

document.getElementById("loginBtn").addEventListener("click", login);

/* ================= USER PANEL ================= */
function updateUserPanel(){
  const panel = document.getElementById("userPanel");
  if(!currentUser){
    panel.style.display="none";
    return;
  }
  panel.innerHTML=`
    <h3>${currentUser.name}</h3>
    <p><strong>Card:</strong> ${currentUser.CNo}</p>
    <p><strong>Blood:</strong> ${currentUser.BG}</p>
    <p><strong>Mobile:</strong> ${currentUser.mobile}</p>
    <p><strong>Status:</strong> ${currentUser.Status}</p>
    <button id="signOutBtn">Sign Out</button>
  `;
  document.getElementById("signOutBtn").addEventListener("click",()=>{
    localStorage.removeItem("kfcUser");
    currentUser=null;
    updateUserPanel();
    loadAlerts();
  });
}

/* Toggle user panel on icon click */
document.getElementById("userIcon").addEventListener("click", ()=>{
  const panel = document.getElementById("userPanel");
  if(panel.style.display==="block") panel.style.display="none";
  else panel.style.display="block";
});

/* ================= LOAD ALERTS ================= */
async function loadAlerts(){
  await document.fonts.ready;
  const container = document.getElementById("alerts-container");

  if(!currentUser){
    container.innerHTML = `<p style="text-align:center;margin-top:50px;font-family:UrduFont;">براہ کرم لاگ ان کریں تاکہ تمام نوٹیفیکیشنز دیکھ سکیں۔</p>`;
    document.getElementById("loginOverlay").style.display = "flex";
    return;
  }

  const res = await fetch('https://livenews.live/KFC/message/alerts.json');
  const data = await res.json();

  data.sort((a,b)=>{
    const [dA,mA,yA] = a.date.split('-').map(Number);
    const [dB,mB,yB] = b.date.split('-').map(Number);
    return new Date(yB,mB-1,dB)-new Date(yA,mA-1,dA);
  });

  container.innerHTML = '';

  data.forEach(item=>{
    const card=document.createElement('div');
    card.className='alert-card';
    card.innerHTML=`
      <img src="https://livenews.live/KFC/logo.png" class="card-logo">
      <div class="alert-date"><i class="fa-solid fa-calendar-days"></i> ${item.date}</div>
      <div class="alert-title">${item.title_en}</div>
      <div class="alert-title" lang="ur">${item.title_ur}</div>
      <div class="alert-body" lang="ur">${item.body_ur}</div>
      <div class="share-icon"><i class="fa-solid fa-bell"></i></div>
    `;
    card.addEventListener('click',()=>card.classList.toggle('active'));

    const shareBtn=card.querySelector('.share-icon');
    shareBtn.addEventListener('click',async e=>{
      e.stopPropagation();
      await document.fonts.ready;
      html2canvas(card,{scale:4,useCORS:true,backgroundColor:null}).then(canvas=>{
        const finalCanvas=document.createElement('canvas');
        const ctx=finalCanvas.getContext('2d');
        const padding=40;
        finalCanvas.width=canvas.width+padding*2;
        finalCanvas.height=canvas.height+padding*2;
        ctx.fillStyle="#ffffff";
        ctx.fillRect(0,0,finalCanvas.width,finalCanvas.height);
        ctx.shadowColor="rgba(0,0,0,0.25)";
        ctx.shadowBlur=30;
        ctx.shadowOffsetY=10;
        ctx.drawImage(canvas,padding,padding);
        finalCanvas.toBlob(blob=>{
          const url=URL.createObjectURL(blob);
          const link=document.createElement('a');
          link.href=url;
          link.download=`Alert_${item.date}.png`;
          link.click();
          URL.revokeObjectURL(url);
        });
      });
    });

    container.appendChild(card);
  });
}

/* ================= INIT ================= */
(async function(){
  await loadUsers();
  checkSession();
  updateUserPanel();
  loadAlerts();
})();
</script>

</body>
</html>
