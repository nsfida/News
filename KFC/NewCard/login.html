<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khawrai Falahi Committee e-Card Login</title>
<style>
body{margin:0;font-family:Calibri,sans-serif;background:#f4f4f9;display:flex;justify-content:center;align-items:center;height:100vh;}
.login-box{background:#fff;border-radius:50px;padding:40px;width:500px;box-shadow:0 5px 20px rgba(0,0,0,0.1);text-align:center;}
.login-box img{width:150px;margin-bottom:20px;}
.login-box h1{font-size:24px;margin-bottom:10px;color:#1976d2;}
.login-box form{display:flex;flex-direction:column;}
.login-box input{margin:10px 0;padding:12px 15px;font-size:16px;border-radius:50px;border:1px solid #ddd;}
.login-box button{padding:12px;font-size:16px;border:none;border-radius:50px;background:#1976d2;color:white;cursor:pointer;margin-top:10px;}
.login-box button:hover{background:#125fa6;}
.error-msg{color:red;font-size:14px;margin-bottom:10px;}
</style>
</head>
<body>
<div class="login-box">
<img src="static/images/logo.png" alt="Logo">
<h1>Khawrai Falahi Committee UAE</h1>
<p>خاورئی فلاحی کمیٹی متحدہ عرب امارات</p>
<div class="error-msg" id="errorMsg"></div>
<form id="loginForm">
<input type="text" id="username" placeholder="Username" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
</div>

<script>
const USERS = {
  "bnNm aWRh": "NzQ2MjEw",
  "YWhtYWRhbWFu": "NDU2NDU2",
  "c2FiaXJhbGk=": "MzU2NDI1",
  "YXJiYWJyaXp3YW4=": "MDIzNjYz",
  "bmF2ZWVkYWxp": "MTAxMDgx",
  "YW1qYWRhbGk=": "YW1qYWRhbDEyMw==",
  "c2FsYXJraGFu": "c2FsYXI0NTY="
};

// Decode Base64
function decodeBase64(str){ return atob(str.replace(/\s/g,'')); }

document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  const uInput = document.getElementById("username").value.trim();
  const pInput = document.getElementById("password").value.trim();

  // Check credentials
  let authenticated = false;
  for(const encodedUser in USERS){
    if(decodeBase64(encodedUser) === uInput && decodeBase64(USERS[encodedUser]) === pInput){
      authenticated = true;
      localStorage.setItem("loggedInUser", uInput);
      window.location.href = "index.html";
      break;
    }
  }

  if(!authenticated){
    document.getElementById("errorMsg").textContent = "Invalid username or password";
  }
});

// Redirect if already logged in
if(localStorage.getItem("loggedInUser")) window.location.href = "index.html";
</script>
</body>
</html>
