<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khawrai Falahi Committee e-Card</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{display:flex;flex-direction:column;align-items:center;background:linear-gradient(135deg,#e0eaff,#ffffff);padding:20px;font-family:Calibri,sans-serif;margin:0;}
.form-container{background:rgba(255,255,255,0.25);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);border-radius:55px;padding:30px;width:500px;max-width:95%;box-shadow:0 8px 32px rgba(0,0,0,0.15);border:1px solid rgba(255,255,255,0.3);position:relative;overflow:hidden;}
.form-container::before{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,rgba(255,255,255,0.15) 0%,rgba(255,255,255,0) 100%);border-radius:55px;pointer-events:none;}
h2{font-size:22px;color:#0d3c91;text-align:center;margin-bottom:15px;font-weight:bold;}
label{display:block;text-align:left;margin-bottom:5px;color:#555;font-weight:bold;}
input,select{width:100%;padding:10px;margin-bottom:12px;border-radius:50px;border:1.5px solid rgba(0,0,0,0.1);font-size:14px;outline:none;transition:0.3s;}
input:focus, select:focus{border-color:#1976d2;box-shadow:0 0 10px rgba(25,118,210,0.3);}
button{padding:12px 20px;background:#1976d2;color:#fff;font-size:16px;border:none;border-radius:50px;cursor:pointer;transition:0.3s;display:flex;justify-content:center;align-items:center;gap:5px;}
button:hover{background:#125fa6;}
.translate-link{text-align:right;font-size:12px;margin-bottom:10px;}
.translate-link a{color:#1976d2;text-decoration:none;font-weight:bold;}
.logo-title{display:flex;align-items:center;flex-direction:column;animation:fadeInDown 1s ease forwards;margin-bottom:10px;}
.logo-title h2{font-size:24px;color:#0d3c91;font-weight:bold;text-align:center;}
.uae-text{font-size:18px;color:#0d3c91;margin-top:5px;text-align:center;}
@keyframes fadeInDown{0%{opacity:0;transform:translateY(-20px);}100%{opacity:1;transform:translateY(0);}}
.logo-title img{width:60px;margin-bottom:10px;animation:logoFade 2.5s ease-in-out infinite;}
@keyframes logoFade{0%{opacity:0.8;transform:scale(1);}50%{opacity:1;transform:scale(1.05);}100%{opacity:0.8;transform:scale(1);}}

.contact-banner{display:flex;justify-content:center;gap:20px;padding:10px 20px;margin-top:20px;font-size:14px;flex-wrap:wrap;background:rgba(255,255,255,0.25);backdrop-filter:blur(18px) saturate(180%);border-radius:25px;border:1px solid rgba(255,255,255,0.3);box-shadow:0 8px 32px rgba(0,0,0,0.15);position:relative;overflow:hidden;}
.contact-banner a{text-decoration:none;color:#0d3c91;display:flex;align-items:center;gap:6px;}
.contact-banner a:hover{color:#125fa6;transform:translateY(-2px);}
.contact-banner .role-tag{font-size:12px;font-weight:bold;margin-left:4px;color:#125fa6;}

footer{margin-top:15px;font-size:14px;text-align:center;}
</style>
</head>
<body>

<div class="logo-title">
  <img src="static/images/logo.png" alt="Logo">
  <h2>Khawrai Falahi Committee UAE</h2>
  <p class="uae-text">خاورئی فلاحی کمیٹی متحدہ عرب امارات</p>
</div>

<div class="form-container">
<form id="ecardForm">
<label for="name">Name (English)</label>
<input type="text" id="name" required>
<label for="urdu_name">Name (Urdu)</label>
<input type="text" id="urdu_name" required>
<div class="translate-link"><a href="https://www.google.com/search?q=english+to+urdu" target="_blank">Translate to Urdu</a></div>
<label for="designation">Designation</label>
<select id="designation" required>
<option value="Committee Member">Committee Member</option>
<option value="President">President</option>
<option value="Vice President">Vice President</option>
<option value="Finance Secretary">Finance Secretary</option>
<option value="Media Manager">Media Manager</option>
<option value="Media Secretary">Media Secretary</option>
<option value="Committee Guardian">Committee Guardian</option>
<option value="Other">Other</option>
</select>
<label for="card_number">Card Number</label>
<input type="text" id="card_number" value="746-210-" required>
<label for="blood_group">Blood Group</label>
<select id="blood_group" required>
<option value="A+">A+</option><option value="A-">A-</option>
<option value="B+">B+</option><option value="B-">B-</option>
<option value="O+">O+</option><option value="O-">O-</option>
<option value="AB+">AB+</option><option value="AB-">AB-</option>
<option value="N/A">N/A</option>
</select>
<label for="contact">Contact (Mobile)</label>
<input type="text" id="contact" placeholder="+9715..." required>
<label for="photo">Upload Photo</label>
<input type="file" id="photo" accept="image/*" required>
<button type="submit"><i class="fas fa-plus-circle"></i> Generate e-Card</button>
</form>
</div>

<!-- Contact Banner -->
<div class="contact-banner">
  <a href="https://wa.me/971557353212" target="_blank"><i class="fab fa-whatsapp"></i> Arbab M. Rizwan <span class="role-tag">President</span></a>
  <a href="https://wa.me/971588840090" target="_blank"><i class="fab fa-whatsapp"></i> Salar Khan <span class="role-tag">Vice President</span></a>
  <a href="https://wa.me/971568039690" target="_blank"><i class="fab fa-whatsapp"></i> Ahmad A. Khattak <span class="role-tag">Acting President</span></a>
  <a href="https://wa.me/971529297289" target="_blank"><i class="fab fa-whatsapp"></i> Naveed A. Liaqat <span class="role-tag">Finance Manager</span></a>
</div>

<footer>
<p>Powered by <a href="https://www.facebook.com/nadeemshahzadfida" target="_blank">Nadeem Shahzad Fida</a></p>
</footer>

<script>
if(!localStorage.getItem("loggedInUser")) window.location.href="login.html";

document.getElementById("ecardForm").addEventListener("submit",function(e){
  e.preventDefault();
  const name = document.getElementById("name").value;
  const urdu = document.getElementById("urdu_name").value;
  const designation = document.getElementById("designation").value;
  const cardNo = document.getElementById("card_number").value;
  const blood = document.getElementById("blood_group").value;
  const contact = document.getElementById("contact").value;
  const file = document.getElementById("photo").files[0];
  if(!file){ alert("Please upload a photo"); return; }
  const reader = new FileReader();
  reader.onload = function(evt){
    localStorage.setItem("ecardData",JSON.stringify({
      name:name, urduName:urdu, designation:designation,
      cardNumber:cardNo, bloodGroup:blood, contact:contact,
      photoData:evt.target.result
    }));
    window.location.href="generate.html";
  };
  reader.readAsDataURL(file);
});
</script>

</body>
</html>
