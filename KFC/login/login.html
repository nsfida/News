<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KFC e-Card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- Login Box -->
  <div id="loginBox">
    <img src="logo.png" class="logo-top">
    <h2>Member Login</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">LOGIN</button>
    <p id="error" class="error"></p>
  </div>

  <!-- Form Box -->
  <div id="formBox" class="hidden">
    <img src="logo.png" class="logo-top">
    <h2>Create e-Card</h2>
    <input id="name" placeholder="Name">
    <input id="urdu" placeholder="Urdu Name">
    <input id="desg" placeholder="Designation">
    <input id="cno" placeholder="Card Number">
    <input id="bg" placeholder="Blood Group">
    <input id="mobile" placeholder="Mobile">
    <input id="photo" type="file">
    <button onclick="generate()">Generate Card</button>
  </div>

  <!-- e-Card Section -->
  <div id="ecardSection" class="hidden">
    <div class="ecard-wrapper">
      <!-- Background -->
      <img src="background.png" class="ecard-bg">
      <img src="pattern.png" class="ecard-pattern">

      <!-- Flags -->
      <img src="uae.png" class="flag uae">
      <img src="pak.png" class="flag pak">

      <!-- Logo -->
      <img src="logo.png" class="ecard-logo">

      <!-- QR Code -->
      <img src="QRCode.png" class="qr">

      <!-- User Photo -->
      <img id="photoPreview" class="ecard-photo">

      <!-- Text Details -->
      <div class="ecard-text">
        <p id="eName">Name Here</p>
        <p id="eUrdu">Urdu Name</p>
        <p id="eDesg">Designation</p>
        <p id="eNo">Card No</p>
        <p id="eBG">Blood Group</p>
        <p id="eMobile">Mobile</p>
        <p id="issueDate">ISSUE DATE: 07 Nov 2025</p>
        <p id="validity">VALIDITY: UAE VISA EXPIRY</p>
      </div>

      <!-- Stamp & Signature -->
      <img src="stamp.png" class="stamp">
      <img src="sign.png" class="sign">
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
