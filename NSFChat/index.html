<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NSFChat — Premium private messaging">
  <meta name="theme-color" content="#0d0d10">
  <title>NSFChat</title>

  <!-- Favicon (inline SVG as data URI for portability) -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Google Fonts preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Supabase JS Client (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- App stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       AUTH VIEW
  ════════════════════════════════════════════════════════ -->
  <div id="auth-view">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <div class="auth-logo-mark">
          <div class="logo-badge">
            <!-- Chat bubble icon -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 2H4C2.9 2 2 2.9 2 4V16C2 17.1 2.9 18 4 18H7V22L12.29 18.35C12.2 18.24 12.1 18.12 12 18H11L7 20.5V18H4V4H20V16H13L8.71 19.29C9.23 19.73 9.9 20 10.62 20H20C21.1 20 22 19.1 22 18V4C22 2.9 21.1 2 20 2Z"/>
            </svg>
          </div>
          <span class="logo-wordmark">
            <span class="nsf">NSF</span><span class="chat-word">Chat</span>
          </span>
        </div>
        <p class="auth-logo-tagline">Private · Secure · Premium</p>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login">Sign In</button>
        <button class="auth-tab" id="tab-signup">Create Account</button>
      </div>

      <!-- Error banner -->
      <div id="auth-error"></div>

      <!-- LOGIN form -->
      <div id="login-form">
        <div class="auth-field">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="auth-field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Your password" autocomplete="current-password">
        </div>
      </div>

      <!-- SIGNUP form -->
      <div id="signup-form" class="hidden">
        <div class="auth-field">
          <label for="signup-name">Display Name</label>
          <input type="text" id="signup-name" placeholder="How you'll appear to others">
        </div>
        <div class="auth-field">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="auth-field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="At least 6 characters" autocomplete="new-password">
        </div>
      </div>

      <!-- Submit button -->
      <button class="auth-submit-btn" id="auth-submit-btn" data-loading="false">
        <span class="btn-inner">
          <span class="btn-spinner">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            </svg>
          </span>
          <span class="btn-label">Sign In</span>
        </span>
      </button>

    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       APP VIEW
  ════════════════════════════════════════════════════════ -->
  <div id="app-view" class="hidden">

    <!-- App header -->
    <header class="app-header">

      <!-- Mobile menu toggle -->
      <button class="icon-btn" id="mobile-menu-btn" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <!-- Logo -->
      <div class="header-logo">
        <div class="header-logo-badge">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 2H4C2.9 2 2 2.9 2 4V16C2 17.1 2.9 18 4 18H7V22L12.29 18.35C12.2 18.24 12.1 18.12 12 18H11L7 20.5V18H4V4H20V16H13L8.71 19.29C9.23 19.73 9.9 20 10.62 20H20C21.1 20 22 19.1 22 18V4C22 2.9 21.1 2 20 2Z"/>
          </svg>
        </div>
        <span class="header-logo-text">
          <span class="nsf">NSF</span><span class="chat-word">Chat</span>
        </span>
      </div>

      <div class="header-spacer"></div>

      <!-- User info + logout -->
      <div class="header-user">
        <div class="header-avatar" id="user-avatar-initials">–</div>
        <span id="user-display-name">–</span>
        <button class="icon-btn" id="logout-btn" title="Sign Out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>

    </header>

    <!-- App body: sidebar + chat -->
    <div class="app-body">

      <!-- ── Sidebar ──────────────────────────────── -->
      <aside id="sidebar">

        <div class="sidebar-header">
          <span class="sidebar-title">Messages</span>
          <button class="new-chat-btn" id="new-chat-btn" title="New Chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>

        <div id="conversations-list"></div>

      </aside>

      <!-- Mobile sidebar overlay -->
      <div id="sidebar-overlay" class="hidden"></div>

      <!-- ── Chat area ────────────────────────────── -->
      <main class="chat-area">

        <!-- Placeholder (no active chat) -->
        <div id="chat-placeholder">
          <div class="placeholder-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <p>Select a conversation or start a new chat</p>
        </div>

        <!-- Chat panel (active conversation) -->
        <div id="chat-panel" class="hidden">

          <!-- Chat header -->
          <div class="chat-header">
            <div id="chat-header-avatar">–</div>
            <div class="chat-header-info">
              <span id="chat-header-name">Name</span>
              <span id="chat-header-email">email</span>
            </div>
          </div>

          <!-- Messages -->
          <div id="messages-container"></div>

        </div>

        <!-- ── Message input bar ───────────────────── -->
        <div id="message-input-bar" class="hidden">

          <!-- Staged file preview -->
          <div id="file-preview" class="hidden">
            <div id="file-preview-thumb"></div>
            <span id="file-preview-name">file.jpg</span>
            <button id="file-preview-cancel" title="Remove">×</button>
          </div>

          <!-- Text + actions row -->
          <div class="input-row">
            <textarea
              id="message-input"
              placeholder="Message…"
              rows="1"
              autocomplete="off"
            ></textarea>
            <div class="input-actions">
              <!-- Media upload -->
              <button class="input-icon-btn" id="media-upload-btn" title="Attach image or video">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
              </button>
              <!-- Hidden file input -->
              <input
                type="file"
                id="file-input"
                accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime"
              >
              <!-- Send -->
              <button id="send-btn" title="Send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"/>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
              </button>
            </div>
          </div>

        </div>

      </main>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       NEW CHAT MODAL
  ════════════════════════════════════════════════════════ -->
  <div id="modal-overlay" class="hidden"></div>
  <div id="new-chat-modal" class="hidden">
    <div class="modal-header">
      <span class="modal-title">New Conversation</span>
      <button class="modal-close" id="modal-close-btn" title="Close">×</button>
    </div>
    <div id="modal-error"></div>
    <div class="modal-field">
      <label for="new-chat-email">Recipient's Email</label>
      <input
        type="email"
        id="new-chat-email"
        placeholder="friend@example.com"
        autocomplete="off"
      >
    </div>
    <button class="modal-start-btn" id="modal-start-btn">Start Chat</button>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       LIGHTBOX (media viewer)
  ════════════════════════════════════════════════════════ -->
  <div id="lightbox" class="hidden">
    <button id="lightbox-close" title="Close">×</button>
    <div id="lightbox-content"></div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       TOAST CONTAINER
  ════════════════════════════════════════════════════════ -->
  <div id="toast-container"></div>

  <!-- ─────────────────────────────────────────────────────
       JavaScript — load order matters
  ───────────────────────────────────────────────────────── -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
